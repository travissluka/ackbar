# `osse25-4dletkf` with the mass field written back, and nothing else changed.
#
# **Ran, answered, stopped at ten of twenty two cycles. Do not re-run it.** The
# answer is a null and the premise behind the question was withdrawn while it was
# running. `docs/osse.md` carries the whole account; this header records what the
# experiment was and what it produced, and nothing else should be inferred from
# the arguments it used to make.
#
# **The result.** SSH spread -0.21% against the baseline, e-folding 8.6+-0.6
# against 8.7+-0.6, and no field favoured: the deltas grew from the fourth
# decimal at five cycles to a scattered +-0.5% at nine, which is two chaotic
# trajectories separating rather than a mechanism acting.
#
# **The premise, and why it fell.** The question was what the discarded
# barotropic residual costs, on `docs/osse.md`'s claim that the mass field
# carried 2.1 cm of implied sea level against a 0.95 cm `ave_ssh` increment. That
# does not reproduce. Read from `ocn.incr.incr.*.nc` on this run's own cycles,
# `sum(dh)` and `d(ave_ssh)` agree at ratio 1.00 to 1.05, correlation 0.99, slope
# 1.00. There is no separable residual: sea level is already written twice, and
# neither route is `h`.
#
# **Why writing it changes nothing even so.** What survives a forecast correlates
# with the increment at +0.03, so it is unrelated adjustment and not a damped
# copy. The anomaly that is left has neither a steric nor a geostrophic
# signature, which makes it sub-deformation-scale mass, and Rossby adjustment
# radiates that out through the FLATHER boundary inside the cycle.
#
# **So the spread collapse is a physics limit on this domain**, and the amplitude
# tuning in the spread report was not being done around a defect. That is the
# useful result, and it is a stronger statement than the experiment was built to
# produce. `docs/osse.md` flags the one place it could reverse: a coarse global
# domain, where localization is floored at two grid cells and the mass field may
# become the retained quantity.
#
# **Why the plain baseline and not one of the three mechanism runs.** `-obc` is
# the only experiment where sea level decay is already slowed, so a change there
# would have to be separated from an interaction. The baseline has the fastest
# sea level collapse of the five and nothing else acting on it, so it has the
# most room to move and the cleanest attribution.
#
# **What the write does, and what it deliberately does not.** Each wet column is
# scaled by `sum(h_ana) / sum(h_bkg)`, which moves exactly the column integral
# and cannot produce a negative thickness. The per-layer form is not an option:
# the analysis itself puts 0.30% of this domain's cells at or below zero
# thickness, which is `adjust_interface_motion: implied h<0` a few steps into
# the forecast. So the filter's *vertical* redistribution of mass is dropped and
# only the column integral is kept. Under Z* the model regrids on its first step
# anyway, so the interfaces are the coordinate's business and the column integral
# is the state. `ackbar.writeback.place_thickness` carries the recipe.
#
# The form was tried against a real restart before this experiment was written:
# one day of `gom_25km` from the scaled set ran with zero truncations and a
# domain mean sea level 1.1 mm from the unscaled set's, so the increment is very
# nearly mean-free, which is also why `ufo::ObsADT` would never have seen it (it
# removes the domain mean before forming departures). The CFL and runtime numbers
# that were once quoted here are withdrawn: those forecasts were launched by hand
# while a cycling experiment held the box, so they measure contention.
#
# Everything else, including the ensemble and its provenance, is
# `osse25-4dletkf.yaml`. Read that file first; nothing about it is restated here.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/letkf
  - obs/adt_j2
  - obs/adt_saral
  - obs/adt_c2
  - obs/adt_hy2a
  - obs/sst_metopb
  - obs/sst_npp
  - obs/sss_smap
  - obs/drifter_sst
  - obs/drifter_sss
  - obs/argo_t
  - obs/argo_s
  - obs/glider_t
  - obs/glider_s

experiment:
  name: osse25-4dletkf-h
  description: OSSE, gom_25km 4D LETKF with the mass field written back

cycle:
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  # Twenty two rather than the baseline's configured thirty, because twenty two
  # is what the baseline actually produced before it was halted, and a paired
  # difference is only paired over cycles both runs have. Nothing here needs the
  # tail: the sea level e-folding this is measured by is fitted over the window
  # the report already uses.
  count: 22

solver:
  window:
    type: '4d'

  # `da/letkf`'s five, plus the mass field. The one changed line in this file.
  #
  # Restated in full rather than appended to, because a layered list replaces
  # rather than merges, and a reader of this file should be able to see what the
  # solver writes without also holding the layer in their head.
  #
  # **This does not go in `da/letkf` yet.** It is the thing under test, and a
  # layer is where a settled answer lives. If the decay rate moves it belongs
  # there, and in `da/hybrid` too, whose ensemble half loses the same part.
  analysis variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  - eastward_sea_water_velocity
  - northward_sea_water_velocity
  - sea_water_cell_thickness

forecast:
  slots: PT6H
  extended:
    length: P5D
    every: PT24H
    keep_states: PT24H
    slots: PT6H

vars:
  obs_dir: $(static_root)/obs/gom12-osse-2015-full/2015

ensemble:
  size: 20
  control: true
  source: offline
  on_missing_member: replace_from_mean
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00/ensemble20

cleanup:
  keep_cycles: 1

model:
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00
