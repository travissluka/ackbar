# One cycle of free forecast, to settle the lagged ensemble before it is
# recentred.
#
# Not a science experiment. Its only product is `run/<cycle>/rst/mem###`, which
# `tools/ensemble-collect.sh` renumbers and `tools/ensemble-recenter.py` then
# recentres into the ensemble every LETKF experiment actually starts from.
#
# **Why it exists.** A member arrives here having been interpolated from a
# z-level GLORYS field and integrated 24 hours by `coldstart-ic.sh`, which is
# the shortest run that writes a self-consistent restart set and not long enough
# to shed the interpolation shock. The symptom is precise and was expensive to
# find: such a member integrates perfectly well on its own and dies in
# `MOM_regridding: adjust_interface_motion() - implied h<0` when handed an
# analysis increment whose maximum is under 1 degC, which is *smaller* than what
# `osse25-3dvar` writes into the control every cycle without trouble. The members
# are not broken, they are marginal: stable when undisturbed and out of room when
# nudged. A second free day gives them that room back.
#
# **It runs before the recentring, and the order is the point.** Recentring adds
# `control - mean` to every member, so a settle that runs *after* it hands back a
# mean that is one free day ahead of the control rather than on it, and measured
# here that is 0.40 degC in temperature and 0.07 m/s in velocity, the latter
# further off centre than the members are from each other. The filter cannot tell
# that offset from information and writes it into the control as an increment on
# the first cycle. Recentring last costs nothing and removes it exactly: the
# members are balanced by then, so the shift lands on a settled ocean rather than
# on a shock.
#
# It has to be an experiment rather than a step inside `ensemble-ic-lagged.sh`
# because `coldstart-ic.sh` initializes from a z-level `ic.nc` and there is no
# offline tool that integrates a *restart set* forward. The forecast task is
# exactly that tool, so this borrows it.
#
# The states it writes are valid one cycle after `cycle.start`, so they are
# restamped back before use; see the ensemble's README.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/none
  # One shared atmosphere, not `ensemble/perturbed-inputs`, and both halves of
  # that are deliberate. GEFS rather than the model's climatology, because the
  # arms that inherit these members read GEFS and a member settled under a
  # different atmosphere arrives carrying a fresh imbalance. Shared rather than
  # per-member, because this run draws twenty three members against an archive
  # of twenty one, and because one day of forcing difference is not where the
  # spread comes from: the members are lagged states, and the arms give each of
  # them its own atmosphere and boundary for the whole of the run that follows.
  - forcing/gefs

experiment:
  name: osse25-ensemble-settle
  description: one free cycle to settle the recentred lagged ensemble

cycle:
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  count: 1

ensemble:
  # Twenty two, for an ensemble of twenty. The draw is over-sized because this
  # is the run that decides which members exist: a member that cannot be
  # integrated freely for one day is not a sample of anything and is dropped,
  # and which member that is has moved every time the recentring recipe changed
  # at all. The failures are all in ten to twenty five metre columns on the
  # shelf, where this domain's sea floor is close enough to the surface that a
  # shifted state is occasionally a state MOM6 will not take.
  size: 22
  control: true
  source: none
  # Every member matters here, because every member is the product. A member
  # rebuilt from the mean would be a state with no independent information
  # sitting in an ensemble whose whole purpose is to carry some.
  on_missing_member: fail_cycle
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00/lagged22

cleanup:
  # Nothing may be reaped: the restarts are the product.
  keep_cycles: 1

model:
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00
