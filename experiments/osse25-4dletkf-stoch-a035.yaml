# `osse25-4dletkf-stoch` with the oSPPT amplitude cut to where the spread lands
# on the error instead of past it.
#
# One number different from `osse25-4dletkf-stoch`: `amplitude` 0.8 to 0.35.
# Everything else, including `rtps: 1.0`, is unchanged, so this is a paired
# difference on the perturbation size alone.
#
# **Why the amplitude and not the relaxation.** `osse25-4dletkf-stoch` raised
# the spread in every field and left the error where it was, and the reason it
# bought nothing is that the spread went into the wrong field. Measured against
# the control's own error over cycles 6 to 22:
#
#     field   spread x   error x   spread/error, base -> stoch
#     SSH        1.28      0.98      0.26 -> 0.35
#     SST        2.55      1.02      0.68 -> 1.70
#     SSS        1.15      1.06      0.59 -> 0.64
#     u          1.29      1.01      0.47 -> 0.60
#     v          1.31      1.04      0.43 -> 0.55
#
# Surface temperature is the only field that crossed one, and it overshot by
# 70%. Every other field is still at least a third short, sea surface height
# worst at 0.35. So the ensemble is now over-confident in nothing and
# *over-dispersed in the one field the observations are densest in*, which is
# exactly the configuration that pulls observation noise into the analysis: the
# departures got worse by 12 to 20% on every temperature platform while the
# altimeters improved by up to 6%.
#
# **Lowering `rtps` would take spread out of the fields that need it.** The two
# knobs act on different fields, and `osse25-letkf-stoch5` is what separates
# them: oSPPT alone, at `rtps: 0.95`, moved surface temperature spread by 1.3 to
# 1.7x and sea surface height and salinity by nothing at all, 1.00 and 0.99. So
# the 28 to 31% this experiment gained in sea surface height and velocity is the
# relaxation's, and the 155% in surface temperature is oSPPT's. Backing the
# relaxation off would give up the altimetric gain, which is the only skill
# improvement the pair produced, and leave the temperature overshoot in place.
#
# **Where 0.35 comes from.** Surface temperature spread has to fall from 0.261
# to about 0.15 to sit on its error of 0.154, which is removing four fifths of
# the added *variance*: `0.261^2 - 0.102^2` is 0.0578 and the target is
# `0.150^2 - 0.102^2`, 0.0121, so the added standard deviation has to come down
# by a factor of 0.46. The pattern statistics in `site/monitor/spread/` measure
# delivered spread as close to proportional to amplitude below the logistic's
# knee, 0.2 giving 0.090 and 0.4 giving 0.174, and 0.8 is slightly into the
# saturation at 0.309 against a linear 0.348. So 0.8 x 0.46 with a little back
# for the saturation is 0.35.
#
# **What it is allowed to prove.** Surface temperature spread near 0.15 rather
# than 0.26, the temperature departures back to at least the baseline's, and the
# altimetric and deep water gains kept: sea surface height error was 3% better
# at every forecast lead and temperature at 700 m 10% better out to five days,
# and those came from the relaxation and from the deep half of the perturbation.
# If the temperature departures do not recover, the amplitude is not what was
# wrong and the next question is the length scale, which at 500 km is three
# e-folding lengths across this basin and has never been swept inside a filter.
#
# Everything about the ensemble, the window and the extended forecasts is in
# `osse25-4dletkf-stoch.yaml` and `osse25-4dletkf.yaml`, and is not restated.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/letkf
  - obs/adt_j2
  - obs/adt_saral
  - obs/adt_c2
  - obs/adt_hy2a
  - obs/sst_metopb
  - obs/sst_npp
  - obs/sss_smap
  - obs/drifter_sst
  - obs/drifter_sss
  - obs/argo_t
  - obs/argo_s
  - obs/glider_t
  - obs/glider_s

experiment:
  name: osse25-4dletkf-stoch-a035
  description: OSSE, gom_25km 4D LETKF, oSPPT at 0.35 with full relaxation

cycle:
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  count: 30

solver:
  window:
    type: '4d'

  local ensemble DA:
    inflation:
      # Unchanged from `osse25-4dletkf-stoch`. See the header: this is the knob
      # that produced the only skill gain the pair had, and it acts on the
      # fields that are still under-dispersed.
      rtps: 1.0

forecast:
  slots: PT6H

  extended:
    length: P5D
    every: PT24H
    keep_states: PT24H
    slots: PT6H

vars:
  obs_dir: $(static_root)/obs/gom12-osse-2015-full/2015

ensemble:
  size: 20
  control: true
  source: offline
  on_missing_member: fail_cycle
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00/ensemble20
  stochastic:
    # The same seed the other two stochastic experiments use, so the three draw
    # the same patterns and differ only by what is asked of them.
    seed: 20150712
    sppt:
      # The one number this experiment exists to change. 0.8, NOAA-PSL's global
      # value, put 70% more surface temperature spread into this ensemble than
      # its error justified; the header has the arithmetic that lands on 0.35.
      amplitude: 0.35
      length_scale: 500000.0
      timescale: PT6H

cleanup:
  keep_cycles: 1

model:
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00
