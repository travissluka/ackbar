# The quarter degree OSSE's hybrid FGAT EnVar, with a 4D-LETKF ensemble.
#
# See docs/osse.md. `osse25-3dfgat` with one layer added, for the same reason
# that experiment is `osse25-3dvar` with one key changed: everything else is
# identical, so the difference in O-B is attributable.
#
# Half the background error from the static B and half from a twenty member
# ensemble the filter beside it maintains. What it should show over 3D-FGAT is a
# background error that knows where the Loop Current is *today*: the static B
# spreads an observation isotropically over a fixed length scale, and the
# ensemble spreads it along the flow. The Gulf is the case that makes the
# difference visible, because almost all of its error is in the position of one
# strongly steered current and its rings.
#
# **`window.type: fgat` means two different things to the two solvers here, and
# both are what is wanted.** The variational analysis solves 3D-FGAT: each
# observation is compared against the background nearest its own time and one
# increment is solved at the window's centre. The ensemble filter beside it gets
# the same trajectory, and for an ensemble filter that is 4D-LETKF, because its
# departures and its observation-space perturbations come from the one hofx over
# the member trajectories while the weights are applied at the analysis time.
# So this experiment is FGAT over a static B plus a 4D-LETKF ensemble, and the
# covariance the variational solve reads is the ensemble at the analysis time,
# which is what FGAT means. `graph.build._check_ensemble_window` refuses `fgat`
# only when the *experiment's* solver is the filter, which is the case where
# there is no variational half to give the word its meaning.
#
# **The ensemble is real ocean states, not perturbations.** The same time-lagged
# GLORYS ensemble `osse25-letkf` uses, and that file carries how it was built
# and why it beats drawing from the static B. The members are then recentred on
# the variational analysis every cycle, so the ensemble follows the run being
# reported.
#
# **Expect the ensemble half to be weaker than it should be.** The LETKF runs
# have it measured: this ensemble loses about a quarter of its temperature
# spread every seven cycles and ends far overconfident, because nothing on this
# domain grows the prior's spread between cycles. A hybrid is the configuration
# where that is least damaging, since the static half carries the covariance the
# ensemble stops describing, and that is the reason to run this one before the
# pure EnVar rather than after.
#
# The 0.5/0.5 weights are the textbook hybrid and are not tuned, which is the
# first thing to sweep if this does not beat 3D-FGAT. With a twenty member
# ensemble the usual finding is that less ensemble is better than the textbook
# says, so the sweep to run is downward.
#
# Localization is 1.5 Rossby radii, floored at two grid cells: `loc_hz` in
# `config/static/diffusion.yaml`, built into `loc_hz.nc` by
# `tools/soca-diffusion.sh`. Changing the multiplier means rebuilding that file.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/variational
  - da/hybrid
  - da/corr_vt_cycled
  - obs/adt_j2
  - obs/adt_saral
  - obs/adt_c2
  - obs/adt_hy2a
  - obs/sst_metopb
  - obs/sst_npp
  - obs/sss_smap
  - obs/drifter_sst
  - obs/drifter_sss
  - obs/argo_t
  - obs/argo_s
  - obs/glider_t
  - obs/glider_s

experiment:
  name: osse25-hybrid
  description: OSSE, gom_25km hybrid FGAT EnVar with a 4D-LETKF ensemble

cycle:
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  count: 30

solver:
  window:
    type: 'fgat'

forecast:
  # Six hourly, the same cadence and for the same reason as `osse25-3dfgat` and
  # `osse25-4dletkf`: the truth the observations were drawn from is six hourly
  # and the archive samples the nearest state rather than interpolating, so no
  # trajectory resolved finer than that can remove the representativeness error
  # already in the observations.
  #
  # Four states inside the 24 hour window, plus the background at its start, and
  # here they are needed for **every member** rather than the control alone,
  # because the ensemble filter evaluates each member's own trajectory. That is
  # the disk cost of this experiment over the deterministic ones.
  slots: PT6H

  # Identical to the other four experiments'. The comparison at each lead is a
  # paired difference, so the launches and the valid times have to match.
  extended:
    length: P5D
    every: PT24H
    keep_states: PT24H
    slots: PT6H

vars:
  # The full thirteen platform archive, the same directory every other
  # experiment in the comparison reads. Two archives sampled from different
  # nature runs must never be mixed, because nothing downstream reads the
  # provenance and the mixture would score as ordinary observation error.
  obs_dir: $(static_root)/obs/gom12-osse-2015-full/2015

ensemble:
  size: 20
  control: true
  # A filter beside the variational analysis, which is what makes the ensemble
  # component flow dependent and observation informed rather than a decaying
  # sample of the perturbations it started with. The members are then recentred
  # on the variational analysis, so the ensemble follows the run being reported.
  source: letkf
  on_missing_member: replace_from_mean
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00/ensemble20

cleanup:
  keep_cycles: 1

model:
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00
