# The quarter degree OSSE's hybrid FGAT EnVar, with a 4D-LETKF ensemble.
#
# See docs/osse.md. `osse25-3dfgat` with one layer added, for the same reason
# that experiment is `osse25-3dvar` with one key changed: everything else is
# identical, so the difference in O-B is attributable.
#
# Half the background error from the static B and half from a twenty member
# ensemble the filter beside it maintains. What it should show over 3D-FGAT is a
# background error that knows where the Loop Current is *today*: the static B
# spreads an observation isotropically over a fixed length scale, and the
# ensemble spreads it along the flow. The Gulf is the case that makes the
# difference visible, because almost all of its error is in the position of one
# strongly steered current and its rings.
#
# **`window.type: fgat` means two different things to the two solvers here, and
# both are what is wanted.** The variational analysis solves 3D-FGAT: each
# observation is compared against the background nearest its own time and one
# increment is solved at the window's centre. The ensemble filter beside it gets
# the same trajectory, and for an ensemble filter that is 4D-LETKF, because its
# departures and its observation-space perturbations come from the one hofx over
# the member trajectories while the weights are applied at the analysis time.
# So this experiment is FGAT over a static B plus a 4D-LETKF ensemble, and the
# covariance the variational solve reads is the ensemble at the analysis time,
# which is what FGAT means. `graph.build._check_ensemble_window` refuses `fgat`
# only when the *experiment's* solver is the filter, which is the case where
# there is no variational half to give the word its meaning.
#
# **The ensemble is real ocean states, not perturbations.** The same time-lagged
# GLORYS ensemble `osse25-4dletkf` uses, and that file carries how it was built
# and why it beats drawing from the static B. The members are then recentred on
# the variational analysis every cycle, so the ensemble follows the run being
# reported.
#
# **Expect the ensemble half to be weaker than it should be.** The prior's
# spread decays cycle over cycle and the run ends overconfident, because the
# spread sources on this domain do not replace what the filter removes; see
# docs/ensemble-spread.md. A hybrid is the configuration where that is least
# damaging, since the static half carries the covariance the ensemble stops
# describing, and that is the reason to run this one before the pure EnVar
# rather than after.
#
# The 0.5/0.5 weights are the textbook hybrid and are not tuned, which is the
# first thing to sweep if this does not beat 3D-FGAT. With a twenty member
# ensemble the usual finding is that less ensemble is better than the textbook
# says, so the sweep to run is downward.
#
# **Read the two components' amplitudes before believing a weight sweep.**
# `oops::HybridCovariance::doMultiply` scales each component's *covariance* by
# its weight, so these are variance weights and 0.5/0.5 preserves the total
# variance only while the two halves have similar amplitude. They do not stay
# similar here: the ensemble starts near the static B and shrinks with every
# cycle, so the hybrid's total background error falls below what the pure static
# run draws, and the analysis makes smaller corrections for a reason that has
# nothing to do with flow dependence. A hybrid that trails 3D-FGAT is therefore
# ambiguous until this is ruled out.
#
# To check it, compare the filter's prior spread against the static B's mixed
# layer error: `ana/mem000/analysis/ensemble/ocn.sprdb.an.<date>.nc` holds the
# first, `$(domain_static)/sst_bgerr.nc` the second, and the ratio between them
# at the first and last cycle is the whole diagnosis.
#
# Localization is 2.0 Rossby radii, floored at two grid cells, and not masked
# over land: `loc_hz_open` in `config/static/diffusion.yaml`, built into
# `loc_hz_open.nc` by `tools/soca-diffusion.sh`. Changing the multiplier means
# rebuilding that file. The masked `loc_hz` is still calibrated and can be
# selected with `vars: {localization_hz: loc_hz}`, but masking a localization
# is wrong here: it is a taper, not a correlation, so land cells have to carry
# a scale or a coastal observation stops reaching across the shelf.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/variational
  - da/hybrid
  - da/corr_vt_cycled
  - ensemble/perturbed-inputs
  - obs/adt_j2
  - obs/adt_saral
  - obs/adt_c2
  - obs/adt_hy2a
  - obs/sst_metopb
  - obs/sst_npp
  - obs/sss_smap
  - obs/drifter_sst
  - obs/drifter_sss
  - obs/argo_t
  - obs/argo_s
  - obs/glider_t
  - obs/glider_s

experiment:
  name: osse25-hybrid
  description: OSSE, gom_25km hybrid FGAT EnVar with a 4D-LETKF ensemble

cycle:
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  # The comparison length, identical across all eight experiments in it.
  count: 20

solver:
  window:
    type: 'fgat'

forecast:
  # Six hourly, the same cadence and for the same reason as `osse25-3dfgat` and
  # `osse25-4dletkf`: the truth the observations were drawn from is six hourly
  # and the archive samples the nearest state rather than interpolating, so no
  # trajectory resolved finer than that can remove the representativeness error
  # already in the observations.
  #
  # Four states inside the 24 hour window, plus the background at its start, and
  # here they are needed for **every member** rather than the control alone,
  # because the ensemble filter evaluates each member's own trajectory. That is
  # the disk cost of this experiment over the deterministic ones.
  slots: PT6H

  # Identical to every other arm's in cadence, length and retention. The
  # comparison at each lead is a paired difference, so the launches and the
  # valid times have to match across arms.
  #
  # `members` is the one axis that may differ, because it changes who is
  # launched and not when: the control's launches and valid times are the same
  # whether it flies alone or with company. A handful of members fly with it
  # here so that ensemble spread against ensemble mean error is answerable at
  # lead, which is the diagnostic that says whether a filter is consistent
  # rather than merely running; the control's own forecast can only ever give
  # the error half of it. `mem000` is the control, since a run with a control
  # numbers its members from zero.
  #
  # A subset rather than all twenty: the long forecast costs one model run per
  # member per launch and a spread estimate at lead does not need the full
  # ensemble, while the filter itself still runs every member.
  extended:
    length: P5D
    every: PT24H
    keep_states: PT24H
    slots: PT6H
    members: [0, 1, 2, 3, 4, 5]

vars:
  # The thirteen platform archive, culled to this domain, and the same directory
  # every other experiment in the comparison reads. Two archives sampled from
  # different nature runs must never be mixed, because nothing downstream reads
  # the provenance and the mixture would score as ordinary observation error.
  # `osse25-noda.yaml` carries what each half of the name means.
  obs_dir: $(static_root)/obs/gom12-osse-2015-era5-binned-gom_25km/2015

ensemble:
  size: 20
  control: true
  # A filter beside the variational analysis, which is what makes the ensemble
  # component flow dependent and observation informed rather than a decaying
  # sample of the perturbations it started with. The members are then recentred
  # on the variational analysis, so the ensemble follows the run being reported.
  source: letkf
  on_missing_member: fail_cycle
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00/ensemble20

cleanup:
  keep_cycles: 1

model:
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00
