# Stage A of the Gulf of Mexico OSSE: the spinup.
#
# See docs/osse.md.
#
# **This is a short spinup on purpose, and that is a change.** It used to be 180
# days, which is what you want when the initial state is a half-degree
# climatological analysis and the model has to build its own Gulf. The initial
# state is now a GLORYS12V1 day: a 1/12 degree reanalysis that already has the
# Loop Current where it actually was on 2015-06-01, with the rings it actually
# had. That mesoscale is the most valuable thing in the initial condition and a
# long spinup is precisely how you lose it.
#
# What is left to spin up is the initialization transient: MOM6 finding its own
# dynamical balance rather than NEMO's, the Z* coordinate settling, and the
# mixed layer coming into equilibrium with the surface forcing. Those are days,
# not months. Thirty is generous.
#
# There is also a reason not to run longer even if it were free. The atmosphere
# is still NCAR/CORE climatology, so the longer this integrates the further it
# drifts toward the model's own climate under an atmosphere with no weather in
# it. The realistic state decays with time here rather than improving.
#
# Cycled rather than run as one 30 day forecast, because a single job that long
# has one failure mode and no checkpoint, and the restart handoff is worth
# proving here rather than in the truth run.
inherit:
  - domain/gom_12km
  - model/mom6sis2
  - da/none

experiment:
  name: osse-spinup
  description: OSSE stage A, gom_12km spinup from the GLORYS initial condition

cycle:
  # The valid time of the initial condition below: GLORYS 2015-06-01 plus the
  # 24 hours of integration that turned it into a restart set. Synoptic, which
  # matters because every experiment downstream inherits this hour through the
  # truth run.
  start: '2015-06-02T00:00:00Z'
  length: P5D
  count: 6

cleanup:
  # Six cycles is small enough to keep whole, and the point of keeping it is
  # that "how long did the transient actually take" is a question about a plot
  # of this run rather than something decided in advance.
  keep_cycles: 6
  keep_every: P5D

model:
  # GLORYS12V1 2015-06-01, integrated 24 hours to produce a restart set. An
  # experiment starts from restarts, and a domain initialized from z-level
  # temperature and salinity has none until the model has run once; see
  # tools/coldstart-ic.sh.
  initial_condition: $(static_root)/ic/gom_12km/glorys/20150602T00
