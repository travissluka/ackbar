# The quarter degree OSSE's null experiment: a free run, with observers.
#
# See docs/osse.md. `da/none`, so nothing is assimilated and the model runs away
# from the truth at whatever rate it runs away. Every skill number the
# assimilating experiments produce is measured against this one, and its
# departures are the only thing that says how much error there was to remove.
#
# It carries the observers, which a free run does not need and this one does:
# with `solver: none` a standalone `hofx` task evaluates each cycle's background
# against the archive and writes the same `ombg` a DA run gets from its analysis
# application. That makes this and the experiments directly comparable in
# observation space, which is where they are compared: `verify` is in
# `run.DEFERRED` and state space verification is done offline.
#
# **The truth is at gom_12km and this is at gom_25km**, and the initial
# condition is drawn from a different year. Both matter and they do different
# work. The resolution makes the two integrations fraternal twins rather than
# identical ones; the year is what puts the Loop Current somewhere else.
#
# An earlier version of this ran from a 2015 initial condition, two days before
# the truth's own launch date, and started 0.022 m from the truth in sea surface
# height. That is under the altimeter noise, so most of what the analysis
# appeared to be correcting was noise it could not correct, and the reported
# skill was diluted by it. The control is now GLORYS 2014-07-10 asserted to be
# an estimate of 2015-07-10: a real ocean, an independent mesoscale, 0.178 m.
# See the README beside the initial condition, and `osse25-spinup.yaml` for why
# 2014 rather than one of the other years.
#
# Nothing is restamped in the sense `tools/restamp-ic.sh` means and no noise is
# added anywhere. The only assertion is the date, and `ic.nc` records both the
# day it was read from and the day it is claimed to describe.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/none
  - forcing/gefs
  - obs/adt_j2
  - obs/adt_saral
  - obs/adt_c2
  - obs/adt_hy2a
  - obs/sst_metopb
  - obs/sst_npp
  - obs/sss_smap
  - obs/drifter_sst
  - obs/drifter_sss
  - obs/argo_t
  - obs/argo_s
  - obs/glider_t
  - obs/glider_s

experiment:
  name: osse25-noda
  description: OSSE, gom_25km free run against the gom_12km truth

cycle:
  # Ten days into the truth period, so that the truth archive covers the whole
  # window of every cycle including the first, whose window opens half a cycle
  # before its analysis time.
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  # The comparison length, and identical across all six experiments in it: a
  # paired difference at each lead needs the same valid times everywhere. The
  # ceiling is the truth archive, which has to cover the last cycle's window
  # (it closes after its analysis time) and every extended forecast lead.
  count: 20

vars:
  # Sampled from the promoted 12km truth run at each observation's own time by
  # `tools/obs-archive-osse.py --truth-run`, which is why the slug names the
  # nature run's grid and not this experiment's. Every experiment in the
  # comparison reads this one directory: the observations are of the ocean, not
  # of a model, and two archives sampled from different nature runs must never
  # be mixed, because nothing downstream reads the provenance and the mixture
  # would score as ordinary observation error.
  obs_dir: $(static_root)/obs/gom12-osse-2015-full/2015

forecast:
  # Identical to `osse25-3dvar`, `osse25-3dfgat` and `osse25-letkf`, and it has
  # to be: the comparison at each lead is a paired difference, so the launches
  # and the valid times must match.
  #
  # This run is the baseline the other three are scored against, so it is the
  # one place a missing extended forecast is not merely a gap. Without it there
  # is no free-run decay curve to put a corrected one beside, and every skill
  # number collapses back to a single 24 hour lead.
  extended:
    length: P5D
    every: PT24H
    keep_states: PT24H
    slots: PT6H

cleanup:
  # Ordinary reaping. The trajectory is recorded online as `bkg/` records by
  # `post.state`, so nothing has to be held for a promotion step at the end;
  # see `tools/local/promote-truth.sh` and the note it carries.
  keep_cycles: 1

model:
  # The settling run's output, promoted to the initial condition stage rather
  # than named where it landed. `osse25-spinup/run/.../rst/mem000` is the same
  # bytes and would work, and it lives under a directory `cleanup` is entitled
  # to reap: an experiment that reads another experiment's run directory is one
  # retention setting away from being unreproducible. The README beside this
  # says what it is and how to rebuild it.
  initial_condition: $(static_root)/ic/gom_25km/osse-control-25km/20150712T00
