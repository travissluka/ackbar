# The OSSE's null experiment: a free run over the DA period, with observers.
#
# See docs/osse.md, stage E. `da/none`, so nothing is assimilated and the model
# runs away from the truth at whatever rate it runs away. Every skill number the
# assimilating experiments produce is measured against this one, and its
# departures are the only thing that says how much error there was to remove.
#
# It carries the observers, which a free run does not need and this one does:
# with `solver: none` a standalone `hofx` task evaluates each cycle's background
# against the archive and writes the same `ombg` a DA run gets from its analysis
# application. That makes the free run and the experiments directly comparable
# in observation space, without a truth run and without `verify`.
#
# **Its initial condition is the truth from a different date**, which is where
# the error comes from and is the whole reason there is anything to correct. See
# the README beside it: the fields are a real ocean state and the date on them
# is an assertion, made by `tools/restamp-ic.sh`.
inherit:
  - domain/gom_12km
  - model/mom6sis2
  - da/none
  - obs/adt_3a
  - obs/sst_noaa19

experiment:
  name: osse-free
  description: OSSE stage E, the free run the others are scored against

cycle:
  # Ten days into the truth period, so that the truth archive covers the whole
  # window of every cycle including the first, whose window opens half a cycle
  # before its analysis time.
  start: '2015-07-12T00:00:00Z'
  length: PT24H
  # Five days short of where the truth ends (2015-08-31), for the mirror of the
  # reason the start is late: the last cycle's window closes after its analysis
  # time, and verification wants truth on both sides of it.
  count: 45

vars:
  # Sampled from the promoted truth run at each observation's own time, by
  # `tools/obs-archive-osse.py --truth-run`. An experiment on real observations
  # over the same period differs from this one in exactly this line.
  #
  # A different archive than the quarter degree OSSE's `gom-osse-2015`, and
  # deliberately so: these are sampled from a different nature run, on a
  # different grid, under different boundary forcing. Two sets of synthetic
  # observations that disagree about the ocean must not share a directory,
  # because nothing downstream reads the provenance and the mixture would score
  # as ordinary observation error.
  obs_dir: $(static_root)/obs/gom12-osse-2015/2015

model:
  # The far end of the truth run, asserted to be an estimate of the ocean fifty
  # days earlier. Build it once the truth run is promoted:
  #
  #   tools/restamp-ic.sh $ACKBAR_STATIC_ROOT/truth/gom_12km/osse-2015/20150831T0000 \
  #                       gom_12km osse-control-12km 2015-07-12T00
  #
  # Its own slug, not the quarter degree run's `osse-control`, for the same
  # reason the observations get their own: a restart set on a different vertical
  # grid is fatal at startup rather than wrong, but only if it is not quietly
  # overwritten first.
  initial_condition: $(static_root)/ic/gom_12km/osse-control-12km/20150712T00
