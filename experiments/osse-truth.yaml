# Stage B of the Gulf of Mexico OSSE: the nature run.
#
# See docs/osse.md. This is the run every experiment is scored against, and the
# run the synthetic observations are sampled from. It is an ordinary free run
# and the only two things that make it truth are that nothing assimilates into
# it and that its states get promoted to a read-only archive afterwards, by
# `tools/promote-truth.sh`.
#
# **Cycled at exactly the DA cycle length**, so that every restart set it writes
# is a truth state valid at some experiment's analysis time. That is the whole
# reason it is not simply a longer spinup: a truth archive on a different
# cadence than the experiments would have to be interpolated in time before
# anything could be scored, and an interpolated truth is a truth with an error
# nobody stated.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/none

experiment:
  name: osse-truth
  description: OSSE stage B, the gom_25km nature run

cycle:
  # Where the spinup left off. Not a round number and not chosen: it is the
  # valid time of the last state stage A wrote, and `cycle.start` has to equal
  # the initial condition's valid time or every window downstream sits offset
  # from its background.
  start: '2015-07-04T00:00:00Z'
  length: PT24H
  count: 60

forecast:
  # Four extra restart writes per cycle, which on a coupled step is nearly free:
  # FMS checks its clock against the interval and dumps in place. It buys two
  # things that cannot be bought later. An observation can be sampled from the
  # truth state nearest its own time rather than from the analysis-time state,
  # which is what makes a 4D window worth running at all. And a 4D experiment
  # can be verified against a truth that actually moves inside the window;
  # without slots every sub-window comparison is scored against a truth that
  # does not, which is the exact criticism this OSSE exists to remove.
  slots: PT6H

cleanup:
  # Nothing is reaped until it has been promoted, and promotion is a separate
  # step run by hand after the run finishes. Sixty cycles of restarts plus their
  # slots is about 3 GB on this domain, which is affordable, and the alternative
  # is a truth archive with holes in it wherever cleanup got there first.
  keep_cycles: 60
  keep_every: P1D

model:
  # The end of the spinup. Naming another experiment's restart set directly is
  # what `cleanup.keep_every` exists to make safe; see the schema.
  initial_condition: $(output_root)/osse-spinup/run/20150629T000000Z/rst/mem000
