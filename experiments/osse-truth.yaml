# Stage B of the Gulf of Mexico OSSE: the nature run.
#
# See docs/osse.md. This is the run every experiment is scored against, and the
# run the synthetic observations are sampled from. It is an ordinary free run,
# and the only two things that make it truth are that nothing assimilates into
# it and that its states get promoted to a read-only archive afterwards, by
# `tools/local/promote-truth.sh`.
#
# **Cycled at exactly the DA cycle length**, so that every restart set it writes
# is a truth state valid at some experiment's analysis time. That is the whole
# reason it is not simply a longer spinup: a truth archive on a different
# cadence than the experiments would have to be interpolated in time before
# anything could be scored, and an interpolated truth is a truth with an error
# nobody stated.
#
# At 1/8 degree rather than the quarter degree this used to run at. The first
# baroclinic Rossby radius in the Gulf is 35 to 45 km; at 25 km the domain is
# barely eddy permitting and an analysis has very little to correct, which
# makes it a poor thing to benchmark against. At 12 km the Loop Current
# resolves and sheds rings, so altimetry has real mesoscale to work on. See
# docs/domains.md.
inherit:
  - domain/gom_12km
  - model/mom6sis2
  - da/none

experiment:
  name: osse-truth
  description: OSSE stage B, the gom_12km nature run

cycle:
  # Where the spinup left off. Not chosen: it is the valid time of the last
  # state stage A wrote, and `cycle.start` has to equal the initial condition's
  # valid time or every window downstream sits offset from its background.
  start: '2015-07-02T00:00:00Z'
  length: PT24H
  count: 60

forecast:
  # Four extra restart writes per cycle, which on a coupled step is nearly free:
  # FMS checks its clock against the interval and dumps in place. It buys two
  # things that cannot be bought later. An observation can be sampled from the
  # truth state nearest its own time rather than from the analysis-time state,
  # which is what makes a 4D window worth running at all. And a 4D experiment
  # can be verified against a truth that actually moves inside the window;
  # without slots every sub-window comparison is scored against a truth that
  # does not, which is the exact criticism this OSSE exists to remove.
  slots: PT6H

cleanup:
  # **Ordinary reaping, because the truth is now recorded as it is produced.**
  # `post.state` reduces every sub-window state to a `bkg/` record inside the
  # cycle that wrote it, so the archive is complete before cleanup ever looks at
  # the restart sets it came from. This used to read `keep_cycles: 60`, which
  # held every state of the whole run so that a promotion step at the end had
  # something to copy: 770 MB a cycle, 46 GB by the end, to produce an archive
  # of 1.8 GB.
  keep_cycles: 1

  # Pins `rst` alone, every ten days. A `bkg/` record is a record and not a
  # restart: it carries the fields a comparison reads, quantized, and a model
  # cannot be started from one. `tools/restamp-ic.sh` needs a real restart set
  # to build the free run's control initial condition from, so a handful are
  # kept, at 168 MB each, rather than the one that would be exactly enough and
  # would have to be chosen correctly now.
  keep_every: P10D

model:
  # The end of the spinup. Naming another experiment's restart set directly is
  # what `cleanup.keep_every` exists to make safe; see the schema.
  #
  # **The directory is the cycle's start, the state is valid at its end.** This
  # is the spinup's last cycle, which began on 06-27 and ran P5D, so the restart
  # under it carries 2015-07-02 in `coupler.res` and that is what `cycle.start`
  # below has to match. Naming `20150702T000000Z` here reads correctly and does
  # not exist.
  initial_condition: $(output_root)/osse-spinup/run/20150627T000000Z/rst/mem000
