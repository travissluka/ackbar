# The scale case: 50 cycles, 20 members. Not goldened, because a golden of a
# thousand nodes is not read by anyone. It exists to hold the generator to
# "seconds", which is the property that makes validate-everything-up-front
# affordable.
inherit:
  - domain/om_1deg
  - model/mom6sis2
  - da/variational
  - obs/adt_3a
  - obs/sst_noaa19
experiment:
  name: big_hybrid
solver:
  covariance: hybrid
cycle:
  start: '2018-04-15T00:00:00Z'
  length: PT24H
  count: 50
ensemble:
  size: 20
  source: offline
  on_missing_member: run_degraded
forecast:
  extended:
    length: P7D
    every: P5D
vars:
  obs_dir: /archive/obs/osse_2018
