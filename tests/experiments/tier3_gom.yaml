# Tier 3: free run cycling on the real model at gom_25km. The phase 4 milestone.
#
# `solver: none`, so there is no analysis and the restart handoff is
# forecast(n) -> forecast(n+1) directly. No observation layers, so no `stage.obs`
# and no `hofx`: this experiment is about the model and the restart chain, and
# everything it does not need is a way for it to fail for an unrelated reason.
#
# Two test modules read it and ask different things. `test_tier3.py` asks the
# claims any domain would have to satisfy, restart continuity and
# reproduce-after-kill; `test_tier3_gom.py` asks the ones only a regional domain
# can be asked, a case whose text and data live apart, an open boundary read
# every timestep, and ACKBAR's own MOM_override actually reaching the model.
#
# It also carries the sub-window states, which is the phase 9 foundation and
# does not need an analysis to be exercised: the question they raise is whether
# one model run can dump a state SOCA reads at a time ACKBAR chose, and that is
# a question about the model and the state reader rather than about the solver.
# A free run is the cheapest place to ask it and the place a wrong answer is
# legible, which is the same argument that put restart continuity here.
#
# Regional rather than global for the reason recorded in docs/domains.md: a
# simulated day costs 6 seconds here against 178 at om_1deg, and there is no
# global-only behaviour left in the forecast path to lose by moving.
#
# Twelve hour cycles from 2015-01-05 01:00, which is where the cold start in
# ic/gom_25km/hycom-smoke leaves off. The case's own ic.nc and obc.nc are a
# single SODA 3.3.1 five-day mean valid 2015-01-04 13:00, so the boundary is
# frozen at that snapshot and does not move for the length of the run. That is a
# known limit of this domain rather than a property of the workflow, and it is
# recorded in docs/domains.md. It does not affect what this test checks.
inherit:
  - domain/gom_25km
  - model/mom6sis2
  - da/none
experiment:
  name: tier3_gom
  description: phase 4, free run cycling at gom_25km
cycle:
  # The instant the initial condition is valid at. `rst/0` is materialized from
  # it at create time, so cycle 1 reads its background exactly the way cycle 3
  # does and there is no first-cycle case anywhere.
  start: '2015-01-05T01:00:00Z'
  length: PT12H
  count: 3
forecast:
  # Four states per twelve hour cycle, at 04, 07, 10 and 13 hundred. One
  # `coupler_main` run writes all of them: FMS checks its clock against the next
  # interval on each coupled step and dumps in place, so this costs four extra
  # restart writes and nothing else. The alternative, a chain of three hour
  # forecasts, pays a whole model initialization per slot and puts a restart
  # handoff between each pair, which is the mechanism with the most ways to be
  # silently wrong in the entire workflow.
  slots: PT3H
model:
  # An offline product, consumed read-only and never generated by an experiment.
  # Named in full rather than composed from the domain and `cycle.start`: the
  # question is which state, not which state happens to sit at this date. See the
  # README beside it for what this particular one is and is not.
  initial_condition: $(static_root)/ic/gom_25km/hycom-smoke/20150105T01
