# Tier 3: free run cycling on the real model. The phase 4 milestone.
#
# `solver: none`, so there is no analysis and the restart handoff is
# forecast(n) -> forecast(n+1) directly. No observation layers, so no `stage.obs`
# and no `hofx`: this experiment is about restart continuity and nothing else,
# and everything it does not need is a way for it to fail for an unrelated
# reason.
#
# Twelve hour cycles because the JRA55-do short sample that ships with
# MOM6-examples covers 1958-01-01 to 1958-01-06, and the initial condition is at
# 1958-01-01 12:00. Three cycles then end at 1958-01-03 00:00, comfortably
# inside it. Longer runs need the real forcing archive, not a longer count.
inherit:
  - domain/om_1deg
  - model/mom6sis2
  - da/none
experiment:
  name: tier3_free
  description: phase 4, free run cycling at OM_1deg
cycle:
  # The instant the initial condition is valid at. `rst/0` is materialized from
  # it at create time, so cycle 1 reads its background exactly the way cycle 3
  # does and there is no first-cycle case anywhere.
  start: '1958-01-01T12:00:00Z'
  length: PT12H
  count: 3
model:
  # An offline product, consumed read-only and never generated by an experiment.
  # See the README beside it for what this particular state is and is not.
  initial_condition: $(static_root)/ic/om_1deg/19580101T12
