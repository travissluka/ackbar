# The tier 2 workhorse: 20 members, 3 cycles, one core and a few seconds each.
#
# LETKF rather than a free run because it is the shape with the most edges. The
# analysis is one job consuming every member, writeback fans out of it as an
# array, and the forecast array is joined to writeback elementwise and then
# feeds the next cycle. If `aftercorr` is wrong anywhere, this experiment pends
# forever instead of finishing.
#
# Two observer layers, so that `stage.obs` and `post.obs` are in the graph:
# they are part of what makes this the shape with the most edges. No archive
# has to exist on disk, because nothing here reads one.
#
# They used to be absent and the graph had them anyway: `da/letkf` named the
# observers it localized, the layers merge on `obs space.name`, and naming one
# created it. That is fixed (`soca._observers`), so what was implicit is stated.
#
# Both altimeters, and not one of each kind, only because an SST layer names
# `$(ackbar_root)` for its operator alias file and the harness that resolves
# this config supplies `scratch_root` and `output_root` and nothing else. Which
# platforms these are is not something any test here asserts.
inherit:
  - domain/stub
  - model/stub
  - da/letkf
  - obs/adt_3a
  - obs/adt_j2
vars:
  # Where the observer layers look, and it deliberately does not exist. The
  # stub solver reads no observations; what this experiment tests is the shape
  # of the graph, and `stage.obs` drops a window whose file is missing, which
  # is every window here.
  obs_dir: /nonexistent/obs

experiment:
  name: stub_letkf
  description: tier 2 workflow test, no science
cycle:
  start: '2018-04-15T00:00:00Z'
  length: PT24H
  count: 3
ensemble:
  size: 20
  # No control: the LETKF does not use one, so the index set is 1..20 and
  # nothing in the graph has to know that mem000 is missing.
  control: false
  source: offline
  on_missing_member: fail_cycle
model:
  stub:
    seconds: 3
    bytes: 4096
