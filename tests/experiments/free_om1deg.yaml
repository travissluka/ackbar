# A free run with observations configured: no analysis, but hofx evaluates
# them. This is also the shape of an OSSE truth run, whose output is promoted
# to another experiment's observation archive.
inherit:
  - domain/om_1deg
  - model/mom6sis2
  - da/none
  - obs/adt_3a
  - obs/sst_noaa19
experiment:
  name: free_om1deg
cycle:
  start: '2018-04-15T00:00:00Z'
  length: PT24H
  count: 3
vars:
  obs_dir: /archive/obs/osse_2018
