# slurm.conf for rancor - single-workstation Slurm used to exercise the ACKBAR
# workflow engine against a real batch scheduler before running on an HPC.
#
# Installed to /etc/slurm/slurm.conf by tools/slurm/install.sh.
# See docs/slurm.md for the how and why, including the 2-fake-node variant.

ClusterName=rancor
SlurmctldHost=rancor

SlurmUser=slurm
SlurmdUser=root

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

AuthType=auth/munge
CredType=cred/munge

# Resource selection: cores are the allocatable unit, memory is tracked and
# enforced, matching how nearly every production HPC is configured.
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# Without this, an unspecified job defaults to DefMemPerNode=UNLIMITED: it is charged
# all 60000M and nothing else can start, so array tasks and independent jobs serialize
# even with cores free. That would misrepresent fan-out to the workflow engine.
# 3750 = RealMemory 60000 / CPUs 16, so memory tracks the cores actually requested.
# MaxMemPerCPU is left unset so a memory-bound job can still ask for few cores and lots of RAM.
DefMemPerCPU=3750
SchedulerType=sched/backfill

# Containment. cgroup v2 (Ubuntu 24.04 default) is autodetected by cgroup.conf.
# If slurmd refuses to start with a cgroup error, see the fallback in
# docs/slurm.md (proctrack/linuxproc + task/affinity + jobacct_gather/linux).
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity

# MPI is launched by mpiexec from spack-stack, not srun, so no PMI plugin.
# See the mpiexec/hydra trap in docs/slurm.md.
MpiDefault=none

ReturnToService=2
SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
KillWait=30
MinJobAge=300
Waittime=0

# Accounting via slurmdbd, so sacct reports completed jobs the way an HPC does.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStoragePort=6819
AccountingStoreFlags=job_script,job_comment
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30
JobCompType=jobcomp/none

# ---------------------------------------------------------------------------
# Nodes and partitions
#
# One node, 8 physical cores (16 hardware threads). Allocating 8 cores takes
# the whole box, which is what `mpiexec -n 8` wants.
#
# To switch to two 4-core fake nodes instead, comment the NodeName line below,
# uncomment the FAKE NODES block, and follow the multi-slurmd steps in
# docs/slurm.md (extra spool dirs and per-node systemd units are required).
# ---------------------------------------------------------------------------

NodeName=rancor CPUs=16 Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=2 RealMemory=60000 State=UNKNOWN

# --- FAKE NODES (2 x 4 cores, multi-slurmd) --------------------------------
# NodeName=n[01-02] NodeHostname=rancor NodeAddr=127.0.0.1 Port=[6821-6822] \
#     CPUs=8 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=2 \
#     RealMemory=28000 State=UNKNOWN
# ---------------------------------------------------------------------------

PartitionName=debug   Nodes=ALL MaxTime=00:30:00 DefaultTime=00:10:00 PriorityTier=100 State=UP
PartitionName=compute Nodes=ALL MaxTime=08:00:00 DefaultTime=01:00:00 PriorityTier=10  State=UP Default=YES
