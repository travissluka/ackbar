# cgroup.conf for rancor. Ubuntu 24.04 is cgroup v2; autodetect picks cgroup/v2.
CgroupPlugin=autodetect
ConstrainCores=yes
ConstrainRAMSpace=yes
# Without this, memory.max is set but memory.swap.max is left unlimited, so a
# job that blows its --mem swaps instead of being killed and finishes
# COMPLETED. That defeats the reason this cluster exists: a job that exceeds
# its memory request has to reach OUT_OF_MEMORY here the way it would on an
# HPC, or the workflow's handling of that state is never exercised.
ConstrainSwapSpace=yes
ConstrainDevices=no
