# The LETKF solver, and the base every ensemble-filter experiment inherits
# from. `da/eakf` swaps the solver for the sequential one; a hybrid adds
# `da/hybrid` and runs this filter beside a variational analysis.
#
# The whole `soca_letkf.x` document is built by `ackbar/soca.py`, the same way
# the variational one is. What is here is the part nothing else implies: which
# variables the ensemble carries, which of them the analysis is allowed to
# write back, the solver's own knobs, and the localization per observer. See
# `docs/analysis.md`.
#
# No land mask and no localization here any more, and both left for the same
# reason. The mask used to be 0.5 here against 0.9 for the variational solver,
# so the filter saw coastal observations the variational analysis discarded, and
# two experiments compared across that difference were not comparing their
# solvers. It is one value in the observer bodies now. The localization went the
# same way: it is a property of what a platform measured, so it lives with the
# platform, in `obs/common/*.yaml`.
solver:
  name: letkf
  covariance: ensemble
  window:
    type: '3d'

  # What writeback puts into the restart set. The LETKF updates *every*
  # variable in its background, which is a superset of this: the ensemble has
  # real spread in layer thickness, and an ensemble filter that saw a
  # correlation between thickness and temperature would use it. What comes back
  # here is written on the background's own layers, because changing the
  # vertical coordinate the analysed temperature is defined on is a separate
  # decision from analysing the temperature.
  #
  # **The velocities are here, and no variational experiment can put them
  # there.** No observer in this workflow measures a current and the static B
  # says nothing about one, so a variational analysis writes no velocity
  # increment at all. An ensemble filter sees the sample covariance between an
  # altimeter's sea surface height and the flow beneath it, and can.
  #
  # Writing them needs two things that tracers do not. The staggered outer face
  # has to be handled, because a symmetric-memory restart carries `u` one column
  # wider than the analysis and leaving that face at the background while every
  # face inside it moves puts a step in the velocity field on the open boundary;
  # `writeback.place` now gives it the increment of the face beside it. And they
  # need their own entry in `increment limits` below, because an oversized
  # velocity increment does more damage than an oversized tracer one.
  #
  # **What this does not mean is that the variational runs have no velocity
  # skill.** They have a good deal, because the increment is not the only path:
  # the model adjusts to the corrected density and pressure within a cycle, so a
  # temperature and salinity analysis reaches the flow geostrophically by the
  # time the next background is written. The baseline for judging a velocity
  # increment is the 3DVar run and not the free run, and scoring against the
  # latter flatters it by a wide margin. Both are measurable: the `bkg/` records
  # carry `eastward_velocity` and `northward_velocity`, and so does the truth.
  analysis variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  - eastward_sea_water_velocity
  - northward_sea_water_velocity

  # What each member's state carries. `sea_water_cell_thickness` is here for the
  # observation operators rather than for the filter: it is what makes anything
  # addressable by depth. `ocean_mixed_layer_thickness` and `sea_water_depth`
  # are absent, unlike the variational case, because what read them there was
  # SOCAParametricOceanStdDev and there is no parametric standard deviation in
  # an ensemble filter.
  #
  # Every analysis variable above appears here, and has to: the filter can only
  # write back a field its background carried, and a velocity named for
  # writeback but absent from the state is a field the analysis never had.
  #
  background variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  - sea_water_cell_thickness
  - eastward_sea_water_velocity
  - northward_sea_water_velocity

  # The largest increment writeback will put into the restart, per variable, as
  # a soft bound: `ackbar.writeback` applies `L*tanh(x/L)`, so small increments
  # pass through, the tail asymptotes to the bound, and nothing is flattened
  # into a plateau. See that module for why soft rather than a clip.
  #
  # **This is here and not in `da/variational` because a sample covariance is
  # not bounded and a covariance model is.** The variational analysis cannot
  # produce an increment far outside its own standard deviations; a
  # twenty-member filter can and does. Left unlimited, this one put 16 degC into
  # a 1.3 mm layer and killed thirteen of eighteen members on the first cycle,
  # reported by MOM6 several steps downstream as
  # `adjust_interface_motion: implied h<0`.
  #
  # **What stabilised this was not the bound.** A first pass with the bound
  # alone took the failures from thirteen of eighteen members to two, and
  # tightening it did not remove the last two, it only changed which members
  # died. A bound acts per point and non-linearly, so it flattens peaks and
  # changes the *shape* of the increment field, and shape is what the model
  # responds to. Two things fixed it: settling the recentred ensemble with a
  # free forecast before it is ever used, which is the larger half and lives in
  # `experiments/osse25-ensemble-settle.yaml`, and relaxing the increment, which
  # scales every gradient by one number and invents none.
  #
  # A ramp rather than a constant, because what is left is a spin-up transient.
  # Cycle 1's background is the ensemble's initial condition, ocean states from
  # different years, so its innovation is the largest the experiment will see;
  # every later background is a 24 hour forecast from an analysis that has
  # already seen the observations. `osse25-3dvar` kept all 45 of its writeback
  # logs and shows the shape directly: increment rms 0.332 at cycle 1, about
  # 0.15 by cycle 5, 0.11 from cycle 20 on. A constant low enough to survive
  # cycle 1 would tax forty cycles for a transient confined to the first few.
  #
  # **The right fix is IAU**, which spreads the increment across the forecast
  # instead of applying all of it between two timesteps, and removes the
  # violence rather than the correction. MOM6 already implements it, in
  # `MOM_oda_incupd.F90`, with `ODA_INCUPD_NHOURS` and `ODA_INCUPD_UV`. The
  # relaxation goes back to 1.0 when that is wired.
  increment relaxation:
    first: 0.25
    cycles: 5

  increment limits:
    sea_water_potential_temperature: 10.0
    sea_water_salinity: 5.0
    sea_surface_height_above_geoid: 1.0
    eastward_sea_water_velocity: 0.5
    northward_sea_water_velocity: 0.5

  # Deterministic LETKF, the square-root filter. The stochastic alternative
  # would need an observation perturbation seed and is a different experiment.
  #
  # One inflation mechanism, not three. SOCA offers `rtps`, which relaxes the
  # posterior *spread* back towards the prior's, `rtpp`, which relaxes the
  # posterior *perturbations*, and `mult`, a flat multiplier. The bundle's own
  # example switches all three on at once because it is a unit test exercising
  # three code paths, and inheriting that gives an ensemble whose spread is set
  # by three interacting knobs none of which can be attributed afterwards.
  #
  # `rtps: 0.95` is deliberately strong. Nothing on these domains maintains
  # spread from outside: the atmosphere is a
  # climatology, the open boundary is frozen, and the ensemble is time-lagged
  # rather than continuously perturbed, so every source of spread is the filter
  # relaxing what its own analysis removed. An LETKF here collapses without this
  # and does not announce that it has.
  local ensemble DA:
    solver: Deterministic LETKF
    inflation:
      rtps: 0.95

  # The halo is what makes an LETKF parallel: each rank solves the points it
  # owns using every observation within `halo size` of them, so the number is a
  # decomposition parameter and a localization one at the same time. It has to
  # be at least the largest localization radius any observer uses or a rank
  # solves with observations it cannot see.
  #
  # Under `solver` rather than in `vars`, and the observer layers no longer
  # mention a distribution at all. A hybrid runs this filter beside a
  # variational analysis over the same observers, and the two need different
  # distributions, so one substituted value cannot serve both. See
  # GLOBAL_DISTRIBUTION in `ackbar/soca.py`.
  #
  # Written as 500000 rather than 500e3, which PyYAML reads as the string
  # '500e3' while eckit reads it as a float. See ackbar.config.lint.
  ensemble distribution: {name: Halo, halo size: 500000}

  # **Every observer, not a list of them.** `ackbar/soca.py:_observers` attaches
  # this to each observer the filter is given, exactly as it attaches the
  # distribution above, and for the same reason plus one: it belongs to all of
  # them, and a merged configuration can only say that by naming them one at a
  # time. This was an `observations:` list with a stanza per platform, which
  # left any platform not named here with no localization at all and invented a
  # phantom observer for every platform named here that the experiment did not
  # carry. An observer may still override it by stating its own
  # `obs localizations`.
  #
  #
  # Localization is added per observer. Each element names only the observer it
  # addresses; nothing else about the observer is restated.
  #
  # `rossby mult` is the localization radius as a multiple of the first
  # baroclinic Rossby radius, and it decides how far an observation is allowed to
  # reach. At 1.0, on a domain that barely resolves one radius, the filter sees so
  # few observations per analysis point that the update is rank starved before the
  # ensemble size is even reached. 1.5 trades some spurious long-range correlation
  # for a better conditioned local problem, which is the right side of that trade
  # at these resolutions.
  #
  # It interacts with the halo above: `halo size` has to exceed the largest
  # localization radius anywhere on the domain or the filter solves with
  # observations it cannot see. 500 km against 1.5 x 45 km leaves an enormous
  # margin in the Gulf and much less of one near the equator, where the first
  # baroclinic radius grows past 200 km. A global domain needs the halo revisited
  # alongside this number.

