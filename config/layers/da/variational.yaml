# The variational solver: 3DVar as it stands, and the base every other
# variational experiment inherits from. An EnVar adds `da/envar`, a hybrid adds
# `da/hybrid`, and FGAT or 4DEnVar change `solver.window.type`. Nothing else
# about this file changes with any of them.
#
# It carries the background error and the minimizer, which are the only two
# parts of the analysis document ACKBAR cannot derive from something the
# experiment already states. Everything else soca_var.x reads is built: the
# geometry from the model layer, the background from the previous cycle's
# restarts, the window from the cycle, the observers from `observations`.
#
# **The standard deviations below are defaults, not a tuned ocean.** They are
# known to run against the pinned SOCA and are not known to be right for
# anywhere. `SOCAParametricOceanStdDev` is the block to look at before believing
# a result, and `docs/background-error.md` says what it takes.
#
# What to reach for first, in order: `ninner` if the minimization is not
# converging or is spending wall clock after it has, the standard deviations if
# the increment is the wrong size, and the diffusion lengths, which are not here
# because they are calibrated offline per domain.

solver:
  name: variational
  covariance: static
  window:
    type: '3d'

  # Ocean only, matching the model layer's `state variables`. The ice fields in
  # the bundle's example are absent for the same reason they are absent there:
  # SIS2 writes `ice_model.res.nc` and the fields metadata's ice section is
  # CICE's, so an ice variable here resolves to something that does not exist.
  # The first ice observer is what makes that worth solving.
  analysis variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid

  # The three above plus what the background error blocks read and never write.
  # `sea_water_cell_thickness` is what makes anything addressable by depth;
  # `ocean_mixed_layer_thickness` and `sea_water_depth` are what
  # SOCAParametricOceanStdDev builds its standard deviations from. All three are
  # derived fields in `config/model/mom6sis2/fields_metadata.yaml` with no `io
  # name`, so they cost nothing to ask for.
  background variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  - sea_water_cell_thickness
  - ocean_mixed_layer_thickness
  - sea_water_depth

  background error:
    covariance model: SABER

    # Correlation, as a diffusion operator. The three filepaths are the product
    # of `tools/soca-diffusion.sh`, which is offline and keyed on domain the way
    # the gridspec is. Until it has run, `ackbar validate` step 3 names them as
    # missing, which is the intended failure: a B calibrated on a different grid
    # than the model integrates on is what this arrangement exists to make
    # impossible. The lengths those files encode are in
    # `config/static/diffusion.yaml`, which nothing here reads, for the same
    # reason nothing here restates the gridgen configuration.
    #
    # `filepath` is a stem rather than a filename. saber appends `.nc`.
    #
    # The vertical scales are calibrated once, against the mixed layer of one
    # restart, rather than recalibrated every cycle. Per-cycle is the measured
    # improvement to make later; what makes it optional is that MLD moves slowly
    # compared to a DA cycle.
    saber central block:
      saber block name: diffusion
      read:
        groups:
        - variables:
          - sea_water_potential_temperature
          - sea_water_salinity
          horizontal:
            filepath: $(domain_static)/diffusion/hz
          vertical:
            levels: $(diffusion_levels)
            filepath: $(domain_static)/diffusion/vt
            # Implicit in the vertical, explicit (the default) in the
            # horizontal. The explicit scheme's iteration count grows with the
            # square of the scale in grid units, and a mixed layer can span a
            # large number of levels; the implicit scheme is a fixed count of
            # tridiagonal solves down each column instead, which is also what
            # lets the vertical scales go uncapped. Horizontally the scales are
            # a few cells and explicit is cheaper.
            #
            # These two values must match `vertical:` in `config/static/diffusion.yaml`.
            # The normalization in `vt.nc` was computed with the operator that
            # file configures, and reading it back through a differently
            # configured operator produces a B that is wrong by a factor nothing
            # reports. `tests/test_diffusion.py` is what holds them together.
            method: implicit
            iterations: 2
        - variables: [sea_surface_height_above_geoid]
          horizontal:
            filepath: $(domain_static)/diffusion/hz_ssh

    saber outer blocks:
    # Taper the background error with depth, so the analysis does not push the
    # same amplitude into the abyss that it does into the thermocline.
    #
    # **`ocean_depth_min` is a cutoff, not a taper, and the name is
    # misleading.** `BkgErrFilt.cc` reads
    #
    #     if (depth <= oceanDepthMin) continue;
    #
    # which leaves the multiplier at zero, so in water shallower than this the
    # background error is not reduced, it is **deleted**. At the 1000 m the
    # bundle's example uses, that removes the entire continental shelf: on the
    # Gulf domains the Louisiana-Texas shelf, the West Florida shelf and
    # Campeche Bank, which is most of the domain's area and exactly where the
    # SST observations are densest. Those observations are then read, evaluated,
    # and multiplied by an error of zero. Hence 0 here.
    #
    # What the cutoff was for is real, an ssh increment over a shelf is not
    # meaningful, and a hard threshold on total depth is a blunt way to say so.
    # Something better belongs here eventually and belongs per variable.
    #
    # `efold_z` is the part that is a taper.
    - saber block name: SOCABkgErrFilt
      ocean_depth_min: 0      # [m]
      rescale_bkgerr: 1.0
      efold_z: 2500.0         # [m]

    # The standard deviations, and the part of this file that wants a decision
    # before any result is believed. Every value is a default: the SST error is
    # a flat 1.0 K because the GODAS field it would otherwise read is not
    # staged, and unbalanced salinity and ssh take the block's own defaults,
    # which put 0.1 m of unbalanced SSH error everywhere. None of it decides
    # whether the analysis runs, all of it decides what the analysis does.
    - saber block name: SOCAParametricOceanStdDev
      temperature:
        sst:
          fixed value: 1.0
      unbalanced salinity: {}
      unbalanced ssh: {}

    # The balance operator, which is what makes an increment in temperature
    # imply one in salinity and in sea surface height rather than three
    # independent analyses of the same water. `kst` is left at the operator's
    # defaults.
    #
    # `input variables` and `output variables` belong here and are absent on
    # purpose: both are the analysis variables, which are already stated once
    # above, and `ackbar/soca.py` fills them in. They are not optional. Without
    # `input variables`, `oops::ModelSpaceCovarianceBase` holds a null pointer
    # that it dereferences the first time it evaluates Jb, which is after every
    # block has been built and reported.
    linear variable change:
      linear variable changes:
      - linear variable change name: BalanceSOCA
        ksshts:
          nlayers: 2

  variational:
    # The iteration count and the reduction target are the two knobs to turn
    # first if the minimization is either not converging or spending wall clock
    # after it has. As set, every solve stops on the count; see `ninner` below.
    minimizer:
      algorithm: RPCG
    iterations:
    - ninner: $(ninner)
      # Written with the dot and the signed exponent, not `1e-10`: PyYAML reads
      # YAML 1.1 and would hand eckit the string. See ackbar.config.lint, which
      # rejects the other spelling.
      gradient norm reduction: 1.0e-10

vars:
  # `diffusion_levels` is the domain's, declared in the domain layer, because it
  # is that domain's NK.

  # Inner iterations per outer loop. One outer loop, which is what `3d` means
  # here; FGAT and 4D add loops rather than iterations.
  #
  # 20, and every solve stops here rather than on the reduction target above:
  # 1.0e-10 is far below what RPCG reaches in any affordable number of
  # iterations on this problem, so the target is a guard against running forever
  # and the count is what actually terminates. That means the analysis is a
  # truncated minimization, which is a real and ordinary choice and not a
  # failure, but it also means this number is the cost knob and the convergence
  # knob at once. Raise it and watch the cost function trace before reading
  # anything into a comparison between two experiments that used different
  # values of it.
  ninner: 20
