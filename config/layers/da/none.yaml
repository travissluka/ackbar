# No analysis. A free run, and the OSSE truth run.
#
# `noda` was a mode in v2, which conflated two independent properties: does the
# run produce an analysis, and does it evaluate observations. This layer answers
# only the first. Observations may still be configured, and are then evaluated
# by a standalone hofx task producing the same ombg diagnostics a DA run gets
# from the analysis application itself.
solver:
  name: none

# The land mask threshold was a YAML anchor in soca-science that only the
# solver files defined, so it still needs an answer with no solver. The
# distribution is not here and is not anywhere in a layer: see
# GLOBAL_DISTRIBUTION in `ackbar/soca.py`.
vars:
  obs_land_mask_min: 0.9
