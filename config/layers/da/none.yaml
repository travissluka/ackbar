# No analysis. A free run, an OSSE nature run, and the null every skill number
# is measured against.
#
# This says only that no analysis is produced. Observations may still be
# configured, and are then evaluated by a standalone `hofx` task producing the
# same `ombg` diagnostics a DA run gets from the analysis application itself, so
# a free run is directly comparable in observation space to the experiments it
# is the baseline for.
solver:
  name: none

# Nothing else here. A free run still carries observers, but everything they
# need they state themselves; the obs distribution is not in any layer at all,
# for which see GLOBAL_DISTRIBUTION in `ackbar/soca.py`.
