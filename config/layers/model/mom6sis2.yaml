# The real forecast model: MOM6-SIS2, run as `coupler_main`.
#
# A MOM6 case arrives in three parts, and the domain layer names each one,
# because which case this is *is* the domain:
#
#   base      the case's text: MOM_input, SIS_input, the tables, input.nml
#   input     its data: grid, bathymetry, initial condition, boundaries
#   override  what ACKBAR changes about it
#
# `base` is used as it ships. Everything in it is linked into the run directory
# untouched except `input.nml` and `diag_table`, which ACKBAR writes, and the
# two override files, which ACKBAR replaces. So updating the model submodule
# brings a case's physics with it instead of leaving a fork of those files here
# to drift against it.
#
# The split between `base` and `input` is MOM6-examples' own: it tracks the text
# and keeps `INPUT/` as symlinks into a gitignored dataset mirror, so that what
# decides the answer is under review and a 300 MB grid file is not in a clone.
# For OM_1deg the two coincide, since upstream ships that mirror. For the
# regional domains they are genuinely apart, the text here and the data under
# `$(static_root)`, which is why this is a path and not `base/INPUT`.

model:
  name: mom6sis2

  # What SOCA needs to build a geometry on this model's grid. Both are absolute
  # rather than the relative names the JEDI examples use, which is the whole
  # point: a relative path resolves against the run directory, so it can only be
  # checked by the job that fails on it, while an absolute one is checked by
  # `ackbar validate` before anything is submitted. SOCA opens either.
  namelist: $(ackbar_root)/config/model/mom6sis2/mom_input.nml
  fields metadata: $(ackbar_root)/config/model/mom6sis2/fields_metadata.yaml

  # What SOCA reads out of a restart set, and what it calls it. The ice and
  # surface restarts SOCA also knows about are absent on purpose: SIS2 writes
  # `ice_model.res.nc` and the fields metadata's ice section is CICE's, so an
  # ice field here would resolve to a variable that does not exist. The first
  # ice observer is what makes that worth solving.
  restart:
    ocn: MOM.res.nc

  # The background hofx evaluates against. Not "everything in the restart": each
  # one is a 3D field read, interpolated and held in memory, so this is the set
  # the configured observers actually need. Temperature and salinity carry SST
  # and the T/S profiles, ssh carries ADT, and cell thickness is what makes any
  # of them addressable by depth.
  state variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  - sea_water_cell_thickness

  executable: $(ackbar_root)/pkg/mom6sis2/ice_ocean_SIS2/build/coupler_main
  base: $(mom6_base_dir)
  input: $(mom6_input_dir)

  # The coupler timestep, which varies with resolution the way `DT` does but
  # lives in `input.nml` rather than in `MOM_input`. It is here so that domains
  # sharing one base directory can still differ in it, which is what lets the
  # four Gulf resolutions read a single `input.nml`.
  coupling_seconds: $(mom6_dt_cpld)

  # ACKBAR's changes to that configuration, as files rather than as generated text,
  # because SOCA reads `MOM_override` too and the two have to be the same
  # bytes: a MOM6 the analysis configures differently from the forecast is a
  # grid they agree on by luck. Named individually rather than as a directory
  # so `ackbar validate` stats each one before anything is submitted.
  #
  # What is in them is mostly bug-retention flags. MOM6-examples cases hold
  # those on to protect their own regression answers, which is right for a
  # regression suite and wrong for a testbed whose entire output is an error
  # statistic. Read the files; each says what it turns off and why.
  override:
    MOM_override: $(mom6_override_dir)/MOM_override
    SIS_override: $(mom6_override_dir)/SIS_override
    # Read by SOCA and not by the forecast, and the only thing the two are
    # allowed to disagree about. It works around SOCA's MOM6 being built
    # without symmetric memory, which makes it refuse the Flather open
    # boundaries a regional domain runs with. Empty on a global domain. The
    # file explains itself and is meant to be deleted.
    MOM_override.soca: $(mom6_override_dir)/MOM_override.soca

  # Diagnostics chosen by what the forecast is for. A cycling forecast's product
  # is the restart set the next cycle reads; writing model history alongside it
  # every cycle is how a free run fills a disk.
  #
  # The extended forecast gets the same empty table, and that is a statement
  # about where ACKBAR's scoring comes from rather than an omission. Everything
  # scored here is read from a restart: `post.fcst` reduces the trajectory's
  # states to `fcst/<init>/F###/`, and `hofx.ext` computes its departures from
  # the same states. Model history would be a second, differently named copy of
  # fields already being kept, and SOCA reads restart variable names (`Temp`,
  # `Salt`, `ave_ssh`) rather than the diagnostic ones, which is why the
  # `fields metadata` contract is with the restarts.
  #
  # Both entries are written out rather than one defaulting to the other,
  # because a forecast with no diag_table is a decision and `_diag_table`
  # refuses to guess it.
  diag_table:
    forecast: $(ackbar_root)/config/model/mom6sis2/diag_table.cycling
    forecast.ext: $(ackbar_root)/config/model/mom6sis2/diag_table.cycling
