# What every swath radiometer has in common. Not a platform, which is what
# `obs/common/` means: nothing in here is inheritable by an experiment, because
# nothing in here turns an observer on. The platform layers beside it inherit
# this one, and an experiment goes on listing the platforms it flies.
#
# See `obs/common/adt.yaml` for what an observer body states, what it leaves to
# the solver layer and to `ackbar/soca.py`, and why the platform layers are
# thin.

vars:
  # Multiples of the local Rossby radius. Separate from the altimeters' because
  # localization is a property of what was measured; a swath radiometer and an
  # along-track altimeter are not representative over the same distance, and
  # this is the knob that says so.
  sst_localization_scale: 1.5

  # How far down a surface measurement reaches, in **model levels**. See the
  # `$localization` block below for the unit, which is not metres, and
  # `docs/analysis.md` for how the number was chosen. `obs/common/sss.yaml` and
  # `obs/common/drifter.yaml` carry the same value for the same reason: they all
  # measure the surface, so a sweep moves all three together.
  sst_vertical_localization_levels: 10

observation bodies:

  sst:

    # See `obs/common/adt.yaml` for what this is and why it is not spelled
    # `obs localizations`. This is the family that carries the vertical half as
    # well, and the two entries below are the reference copy: `obs/common/sss`
    # and `obs/common/drifter` restate them and point here.
    #
    # **Rossby stays first, and it is not a matter of taste.**
    # `soca::ObsLocRossby::computeLocalization` caches its result per horizontal
    # point, and on a cache hit *assigns* the cached vector rather than
    # multiplying into it. `oops::ObsLocalizations` applies the entries in order
    # into one vector that starts as ones, so the assignment is only harmless
    # while Rossby is the entry that sees the ones. With the vertical entry
    # first, Rossby overwrites it at every level of a column but the first,
    # which on this grid is forty-nine levels in fifty.
    $localization:
    - localization method: Rossby
      rossby mult: $(sst_localization_scale)
      min grid mult: 1.0

    # **The vertical coordinate is a model level index, not a depth in metres.**
    # `soca_geom_mod.F90` fills the geometry's `vert_coord` with `real(jz)`, so
    # the geometry iterator's third coordinate at level k is k, and the
    # lengthscale here counts levels. A surface platform therefore declares a
    # constant coordinate of 1 instead of naming a field in the ioda file:
    # `ioda vertical coordinate: depth` would compare metres against level
    # indices, so a 175 m observation would read as 175 levels away, localize to
    # zero everywhere, and be assimilated by nothing.
    #
    # Gaspari-Cohn on that distance, which is a taper to a hard cutoff at the
    # lengthscale rather than an e-folding scale. `docs/analysis.md` carries what
    # the level count is in metres on the Gulf grid and why this number is the
    # least settled thing in the block.
    #
    # It only reaches the analysis if the geometry iterates in three dimensions,
    # which `ackbar/soca.py:_iterator_dimension` derives from this entry's
    # presence rather than leaving to a second statement in a layer.
    - localization method: Vertical localization
      vertical lengthscale: $(sst_vertical_localization_levels)
      assign constant vertical coordinate to obs: true
      constant vertical coordinate value: 1
      localization function: Gaspari Cohn

    # Everything in `obs space` that is not this platform's identity. What a
    # platform layer is left holding is its name and the two paths that name
    # follows into the archive and out to `obs_out/`.
    obs space:
      simulated variables: [seaSurfaceTemperature]
      # One writer per observer. These files are small and one rank writing a
      # small file is faster than the aggregation that avoids it.
      io pool:
        max pool size: 1
      # Per experiment, cycle and member, so a healed member draws the same
      # perturbation the abandoned one did. `ackbar/config/jobtime.py` derives
      # it; nothing here may invent one.
      obs perturbations seed: '{{seed}}'
    obs operator:
      name: Identity
      # Absolute, so `ackbar validate` stats it before anything is submitted.
      # The relative name the JEDI examples use resolves against the run
      # directory, where the only thing that can notice its absence is the job
      # that fails.
      observation alias file: $(ackbar_root)/config/obs/obsop_name_map.yml
    obs error:
      covariance model: diagonal
    obs filters:
    - filter: Domain Check
      where:
      - variable: {name: GeoVaLs/sea_area_fraction}
        minvalue: 0.9
    - filter: Bounds Check
      minvalue: -2.0
      maxvalue: 36.0
    - filter: Background Check
      # In units of the observation error, so 5.0 was 2.5 K. Effectively off
      # for the same reasons `obs/common/adt.yaml` sets 10 m: a synthetic
      # archive holds no gross error for this to catch, everything it removes
      # is signal, and censoring the free run's departures harder than the
      # analysis run's scores the comparison against a flattered baseline.
      # 100 sigma is 50 K, which no ocean reaches and a diverged model passes.
      threshold: 100.0
    # An observation whose declared error is zero would be assimilated with
    # infinite weight.
    - filter: Domain Check
      where:
      - variable: {name: ObsError/seaSurfaceTemperature}
        minvalue: 0.001
