# What a surface drifter reports. Not a platform, which is what `obs/common/`
# means: nothing in here turns an observer on. The two drifter layers beside it
# inherit this one.
#
# See `obs/common/adt.yaml` for what an observer body states and what it leaves
# to the solver layer and to `ackbar/soca.py`.
#
# **Separate from `obs/common/sst.yaml` and `obs/common/sss.yaml`, which observe
# the same two variables.** A drifter is not a small satellite. It is a point
# measurement from a hull at fifteen centimetres depth, where a radiometer's
# value is an average over a footprint that is already most of an analysis cell,
# and the two are therefore representative over quite different distances. That
# difference is the localization scale below, and folding a drifter into the
# satellite bodies to save a file would silently give it the satellite's.

vars:
  # Multiples of the local Rossby radius. A point, so the same scale the profiles
  # use rather than either satellite's.
  drifter_localization_scale: 1.0

  # How far down a surface measurement reaches, in **model levels**, not metres.
  # `obs/common/sst.yaml` carries the unit and the reasoning; the value is the
  # same there and in `obs/common/sss.yaml`. A drifter hull sits at fifteen
  # centimetres, which is the same level a radiometer's skin value lands in, so
  # the vertical reach is the one thing here a drifter does not differ in.
  drifter_vertical_localization_levels: 10

observation bodies:

  drifter_sst:

    # See `obs/common/sst.yaml` for why Rossby is first and why the vertical
    # lengthscale is counted in model levels rather than in metres.
    $localization:
    - localization method: Rossby
      rossby mult: $(drifter_localization_scale)
      min grid mult: 1.0
    - localization method: Vertical localization
      vertical lengthscale: $(drifter_vertical_localization_levels)
      assign constant vertical coordinate to obs: true
      constant vertical coordinate value: 1
      localization function: Gaspari Cohn

    obs space:
      simulated variables: [seaSurfaceTemperature]
      io pool:
        max pool size: 1
      obs perturbations seed: '{{seed}}'

    obs operator:
      name: Identity
      observation alias file: $(ackbar_root)/config/obs/obsop_name_map.yml

    obs error:
      covariance model: diagonal

    obs filters:
    - filter: Domain Check
      where:
      - variable: {name: GeoVaLs/sea_area_fraction}
        minvalue: 0.9
    - filter: Bounds Check
      minvalue: -2.0
      maxvalue: 36.0
    - filter: Background Check
      # Effectively off, as everywhere else in this archive. See
      # `obs/common/adt.yaml` for why a synthetic archive wants it that way.
      threshold: 100.0
    - filter: Domain Check
      where:
      - variable: {name: ObsError/seaSurfaceTemperature}
        minvalue: 0.001

  drifter_sss:

    $localization:
    - localization method: Rossby
      rossby mult: $(drifter_localization_scale)
      min grid mult: 1.0
    - localization method: Vertical localization
      vertical lengthscale: $(drifter_vertical_localization_levels)
      assign constant vertical coordinate to obs: true
      constant vertical coordinate value: 1
      localization function: Gaspari Cohn

    obs space:
      simulated variables: [seaSurfaceSalinity]
      io pool:
        max pool size: 1
      obs perturbations seed: '{{seed}}'

    obs operator:
      name: Identity
      observation alias file: $(ackbar_root)/config/obs/obsop_name_map.yml

    obs error:
      covariance model: diagonal

    obs filters:
    - filter: Domain Check
      where:
      - variable: {name: GeoVaLs/sea_area_fraction}
        minvalue: 0.9
    - filter: Bounds Check
      minvalue: 20.0
      maxvalue: 40.0
    - filter: Background Check
      threshold: 100.0
    - filter: Domain Check
      where:
      - variable: {name: ObsError/seaSurfaceSalinity}
        minvalue: 0.001
