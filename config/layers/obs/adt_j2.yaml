# Absolute dynamic topography from Jason-2, along track.
#
# The reference orbit: 66 degrees, ten day repeat, 315 km between tracks.
# Coarse in space and dense in time, and the diagonal one.
#
# The whole observer is the `adt` body in `obs/common/adt.yaml`,
# which this layer inherits. What is here is this platform's identity: its
# name, and the two paths that name follows into the archive and out to
# `obs_out/`. Anything restated here would override the body.

inherit:
  - obs/common/adt

observations:
- obs space:
    name: adt_j2
    # The archive is keyed by date, because an archive has no cycle numbers: it
    # is built once and read by experiments that number their cycles
    # differently. The experiment's own output is keyed by cycle number, like
    # every other directory it writes, so cleanup and the harvest address it the
    # same way they address restarts. See the header of `ackbar/paths.py`.
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/adt_j2.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).adt_j2.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: adt
