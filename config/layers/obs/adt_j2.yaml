# Absolute dynamic topography from Jason-2, along track.
#
# The reference orbit: 66 degrees, ten day repeat, 315 km between
# tracks. Coarse in space and dense in time, and the diagonal one.
#
# See `obs/adt_3a.yaml` for what an observer layer states and what it
# deliberately leaves to the solver layer and to `ackbar/soca.py`. The
# observation error is not here: `covariance model: diagonal` with nothing
# assigned reads `ObsError/<variable>` out of the file, and for a synthetic
# archive that is what `PLATFORMS` in `tools/obs-archive-osse.py` wrote there
# and drew the noise with. `docs/observing-system.md` says where it comes from.

observations:
- obs space:
    name: adt_j2
    # The archive is keyed by date, because an archive has no cycle numbers: it
    # is built once and read by experiments that number their cycles
    # differently. The experiment's own output is keyed by cycle number, like
    # every other directory it writes, so cleanup and the harvest address it the
    # same way they address restarts. See the header of `ackbar/paths.py`.
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/adt_j2.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).adt_j2.{{window_begin:%Y%m%d%H}}.nc4
    simulated variables: [absoluteDynamicTopography]
    io pool:
      max pool size: 1
    obs perturbations seed: '{{seed}}'
  obs operator:
    name: ADT
  obs error:
    covariance model: diagonal
  obs filters:
  - filter: Domain Check
    where:
    - variable: {name: GeoVaLs/sea_area_fraction}
      minvalue: $(obs_land_mask_min)
  - filter: Domain Check
    where:
    - variable: {name: GeoVaLs/sea_surface_temperature}
      minvalue: 5.0
  - filter: Background Check
    # 0.5 m, and `obs/adt_3a.yaml` says 0.2. The threshold is there to reject
    # observations the background cannot possibly be that far from, and how far
    # that is depends on the background. This OSSE's is deliberately wrong by
    # about 9 cm rms at cycle zero and grows from there, with the largest
    # departures along the Loop Current front, which is precisely the signal.
    # At 0.2 m it rejects 4 per cent of the network on the first day and more
    # every cycle after, and every one of those is a real observation of a real
    # error: there are no gross errors in a synthetic archive to catch.
    absolute threshold: 0.5
  - filter: BlackList
    where:
    - variable: {name: MetaData/latitude}
      minvalue: -65
      maxvalue: -30
    - variable: {name: MetaData/longitude}
      minvalue: -125
      maxvalue: -90
  - filter: BlackList
    where:
    - variable: {name: MetaData/latitude}
      minvalue: -65
      maxvalue: -30
    - variable: {name: MetaData/longitude}
      minvalue: 60
      maxvalue: 110
