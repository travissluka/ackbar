# Absolute dynamic topography from HY-2A, along track.
#
# A 14 day repeat, between Jason-2 and SARAL in every respect.
#
# The whole observer is the `adt` body in `obs/common/adt.yaml`,
# which this layer inherits. What is here is this platform's identity: its
# name, and the two paths that name follows into the archive and out to
# `obs_out/`. Anything restated here would override the body.

inherit:
  - obs/common/adt

observations:
- obs space:
    name: adt_hy2a
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/adt_hy2a.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).adt_hy2a.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: adt
