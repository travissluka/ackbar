# Sea surface temperature from AVHRR on Metop-B, swath.
#
# Mid-morning orbit: 09:30 local descending, so it sees the Gulf before the
# afternoon platform and before the diurnal warm layer.
#
# The whole observer is the `sst` body in `obs/common/sst.yaml`,
# which this layer inherits. What is here is this platform's identity: its
# name, and the two paths that name follows into the archive and out to
# `obs_out/`. Anything restated here would override the body.

inherit:
  - obs/common/sst

observations:
- obs space:
    name: sst_metopb
    # The archive is keyed by date, because an archive has no cycle numbers: it
    # is built once and read by experiments that number their cycles
    # differently. The experiment's own output is keyed by cycle number, like
    # every other directory it writes, so cleanup and the harvest address it the
    # same way they address restarts. See the header of `ackbar/paths.py`.
    # Where this platform's bins are in the archive. ACKBAR's own key, like
    # `$required`: `stage.obs` joins the bins this cycle's window touches into
    # the `obsdatain` file below, and JEDI is never shown either the archive or
    # this key. The archive is filed in fixed time bins that know nothing about
    # the cycle, so there is no per cycle path here to name.
    # See `src/ackbar/obsarchive.py`.
    $archive: $(obs_dir)/sst_metopb
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_in_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/sst_metopb.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).sst_metopb.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: sst
