# Salinity from the profiling float array.
#
# The same hulls as `argo_t`, from the same rise. See that layer for the array.
#
# The whole observer is the `profile_s` body in `obs/common/profile.yaml`, which
# this layer inherits. What is here is this platform's identity: its name, and
# the two paths that name follows into the archive and out to `obs_out/`.
# Anything restated here would override the body.

inherit:
  - obs/common/profile

observations:
- obs space:
    name: argo_s
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/argo_s.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).argo_s.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: profile_s
