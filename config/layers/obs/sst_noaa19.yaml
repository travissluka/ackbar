# Sea surface temperature from AVHRR on NOAA-19, swath.
#
# Flown by the tier 3 and 1 degree global test experiments, not by the Gulf
# OSSE: NOAA-19's orbit had drifted to a 14:30 crossing by 2015, within an
# hour of Suomi-NPP, and two platforms seeing the same ocean at the same
# time of day are one platform and a duplicate count.
#
# The whole observer is the `sst` body in `obs/common/sst.yaml`,
# which this layer inherits. What is here is this platform's identity: its
# name, and the two paths that name follows into the archive and out to
# `obs_out/`. Anything restated here would override the body.

inherit:
  - obs/common/sst

observations:
- obs space:
    name: sst_noaa19
    # Where this platform's bins are in the archive. ACKBAR's own key, like
    # `$required`: `stage.obs` joins the bins this cycle's window touches into
    # the `obsdatain` file below, and JEDI is never shown either the archive or
    # this key. The archive is filed in fixed time bins that know nothing about
    # the cycle, so there is no per cycle path here to name.
    # See `src/ackbar/obsarchive.py`.
    $archive: $(obs_dir)/sst_noaa19
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_in_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/sst_noaa19.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).sst_noaa19.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: sst
