# Ported from soca-science configs/soca/obs/adt_3a.yaml.
#
# What changed in the port, and why:
#
#   *obs_distribution / *obs_distribution_opt  ->  removed entirely
#       These were YAML anchors defined in the *solver* file, so the same
#       observer got RoundRobin under 3DVar and Halo under LETKF. That is
#       layering by DA mode, done through anchors, and it works right up until
#       a cycle contains two applications: a hybrid reads these same observers
#       through a variational solve and an ensemble filter, and they need
#       different answers. v2 patched around that with `sed` markers keyed on
#       whether the LETKF was running solo or inside a `3dhyb`.
#
#       So it is not a property of the platform, and it is not really one of
#       the experiment either: it is a property of the application reading the
#       file. `ackbar/soca.py` sets it, an observer says nothing about it, and
#       what an experiment states is the one part it does choose, the halo
#       size, under `solver.ensemble distribution`.
#
#       (ioda reads a distribution's parameters directly under `distribution`
#       rather than under an `options` key. soca-science's spelling was for an
#       older ioda, and the Halo distribution finds no `halo size` there and
#       refuses to construct.)
#
#   *obs_land_mask  ->  an ordinary filter with $(obs_land_mask_min)
#       Same story: the threshold was 0.9 under 3DVar and 0.5 under LETKF.
#       Filter chains have no natural merge key (there are two BlackList
#       filters below), so they replace wholesale, and the varying part is a
#       substituted value rather than a merged one.
#
#   !IF_APP_letkf obs localizations  ->  removed
#       Now supplied by da/letkf. Note that the original guarded this block
#       with !IF_APP_letkf while sst_noaa19 used !IF_letkf, so one of the two
#       never fired. That bug is only possible because the mechanism was sed.
#
#   __SEED__  ->  {{seed}}
#       Job-time, and must derive from experiment, cycle and member so that a
#       heal reproduces the original ensemble.

observations:
- obs space:
    name: adt_3a
    # The archive is keyed by date, because an archive has no cycle numbers: it
    # is built once and read by experiments that number their cycles
    # differently. The experiment's own output is keyed by cycle number, like
    # every other directory it writes, so cleanup and the harvest address it the
    # same way they address restarts. See the header of `ackbar/paths.py`.
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/adt_3a.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{cycle}}/$(experiment).adt_3a.{{window_begin:%Y%m%d%H}}.nc4
    simulated variables: [absoluteDynamicTopography]
    io pool:
      max pool size: 1
    obs perturbations seed: '{{seed}}'
  obs operator:
    name: ADT
  obs error:
    covariance model: diagonal
  obs filters:
  - filter: Domain Check
    where:
    - variable: {name: GeoVaLs/sea_area_fraction}
      minvalue: $(obs_land_mask_min)
  - filter: Domain Check
    where:
    - variable: {name: GeoVaLs/sea_surface_temperature}
      minvalue: 5.0
  - filter: Background Check
    absolute threshold: 0.2
  - filter: BlackList
    where:
    - variable: {name: MetaData/latitude}
      minvalue: -65
      maxvalue: -30
    - variable: {name: MetaData/longitude}
      minvalue: -125
      maxvalue: -90
  - filter: BlackList
    where:
    - variable: {name: MetaData/latitude}
      minvalue: -65
      maxvalue: -30
    - variable: {name: MetaData/longitude}
      minvalue: 60
      maxvalue: 110
