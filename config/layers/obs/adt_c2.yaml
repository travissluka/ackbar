# Absolute dynamic topography from CryoSat-2, along track.
#
# A 369 day repeat with a 30 day subcycle, which over one experiment is
# quasi-random coverage that never falls in the same place twice.
#
# The whole observer is the `adt` body in `obs/common/adt.yaml`,
# which this layer inherits. What is here is this platform's identity: its
# name, and the two paths that name follows into the archive and out to
# `obs_out/`. Anything restated here would override the body.

inherit:
  - obs/common/adt

observations:
- obs space:
    name: adt_c2
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/adt_c2.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).adt_c2.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: adt
