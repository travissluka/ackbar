# Sea surface temperature from VIIRS on Suomi-NPP, swath.
#
# 13:30 local ascending, and the better instrument of the two: finer, and
# with a lower retrieval error.
#
# The whole observer is the `sst` body in `obs/common/sst.yaml`,
# which this layer inherits. What is here is this platform's identity: its
# name, and the two paths that name follows into the archive and out to
# `obs_out/`. Anything restated here would override the body.

inherit:
  - obs/common/sst

observations:
- obs space:
    name: sst_npp
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/sst_npp.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).sst_npp.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: sst
