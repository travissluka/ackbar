# Temperature from the glider line.
#
# Five gliders flying waypoints at a quarter of a metre a second, casting from
# 5 to 1000 m every six hours, which is one cast per dive. What a glider gives
# that a float does not is a *section*: a continuous slice across whatever the
# line crosses, which over the Loop Current front is the measurement the front is
# actually in. The Gulf really has this every summer, in the hurricane glider
# network, and this archive's period is that season.
#
# The whole observer is the `profile_t` body in `obs/common/profile.yaml`, which
# this layer inherits. What is here is this platform's identity: its name, and
# the two paths that name follows into the archive and out to `obs_out/`.
# Anything restated here would override the body.

inherit:
  - obs/common/profile

observations:
- obs space:
    name: glider_t
    obsdatain:
      engine:
        type: H5File
        obsfile: $(obs_dir)/{{current_cycle:%Y%m%d%H}}/glider_t.{{window_begin:%Y%m%d%H}}.nc4
    obsdataout:
      engine:
        type: H5File
        obsfile: $(obs_out_dir)/{{current_cycle:%Y%m%dT%H%M%SZ}}/$(experiment).glider_t.{{window_begin:%Y%m%d%H}}.nc4
  $inherit: profile_t
