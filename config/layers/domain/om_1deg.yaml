# The 1 degree global domain: development and test.
#
# Per-task resources live here rather than in the site layer, because domain is
# what actually drives the difference between OM_1deg and OM4_025. The site
# layer supplies partition, account, launcher, roots and limits, and nothing
# that depends on the size of the problem.

vars:
  # A domain's MOM6 configuration comes in three parts, which is two more than a
  # MOM6 configuration usually has. Vars rather than keys under `domain` because
  # the model layer is what consumes them, and a model that is not MOM6 has no
  # use for the concept.
  #
  # `mom6_base_dir` is the stock text: MOM_input, SIS_input and the tables.
  # Here it is upstream's, inside the MOM6-examples submodule, which is why this
  # is the one place their spelling `OM_1deg` appears. Everything ACKBAR keys on
  # domain uses the domain's own name, `om_1deg`, and two names differing only
  # in capitalization are exactly the kind of near-duplicate worth confining to
  # one line.
  mom6_base_dir: $(ackbar_root)/pkg/mom6sis2/ice_ocean_SIS2/OM_1deg

  # The data half. For this domain it sits inside the stock directory, since
  # MOM6-examples ships an `INPUT` of symlinks into its own dataset mirror. The
  # regional domains split the two, so the model layer reads a path rather than
  # assuming `base/INPUT`.
  mom6_input_dir: $(mom6_base_dir)/INPUT

  # The coupler timestep this domain has always run at.
  mom6_dt_cpld: 7200

  # What ACKBAR changes about the stock configuration. Separate from it because
  # that one is upstream's and not ours to edit, and keyed on the domain rather
  # than on the upstream name.
  mom6_override_dir: $(ackbar_root)/config/model/mom6sis2/domain/om_1deg

  # Where this domain's offline stages land: the gridspec today, the
  # background error parameters once they are built. A var as well as a
  # `domain.static` key, because the da layer names files under it and
  # cannot know which domain it is being merged with.
  domain_static: $(static_root)/static/om_1deg

  # Vertical levels the background error's diffusion parameters are
  # calibrated on, which is this domain's NK. Here rather than in the da
  # layer because a B built for the wrong number of levels is wrong
  # whatever the solver says, and because the da layer is shared by every
  # domain.
  diffusion_levels: 75

domain:
  name: om_1deg

  # The static stage: what an offline step produces once for this domain, and
  # what every experiment on it then reads. Named by the domain layer rather
  # than by the experiment, unlike the initial condition, because that is what
  # "keyed on domain" means: two experiments here share one `soca_gridspec.nc`,
  # and that sharing is what makes them comparable by construction rather than
  # by inspection. See Offline stages in docs/design.md, and
  # `tools/soca-gridspec.sh` for what writes it.
  static: $(domain_static)

  resources:
    # Everything that is bookkeeping: python, shell, a few file operations.
    # Named `default` so that adding a task does not silently submit it with
    # whatever sbatch defaults to, which on a real machine is one core.
    default:
      ntasks: 1
      time: '00:10:00'
      mem: 4G

    forecast:
      ntasks: 8
      time: '00:30:00'
      mem: 16G
    forecast.ext:
      # The same model, a longer integration.
      ntasks: 8
      time: '04:00:00'
      mem: 16G
    da:
      ntasks: 8
      time: '01:00:00'
      mem: 32G
    # The ensemble's own analysis, where a hybrid runs one. Same shape as
    # `da`: one MPI job holding every member at once.
    da.ens:
      ntasks: 8
      time: '01:00:00'
      mem: 32G
    hofx:
      ntasks: 8
      time: '00:20:00'
      mem: 16G
    b.corr_vt:
      ntasks: 8
      time: '00:15:00'
      mem: 16G
    recenter:
      ntasks: 8
      time: '00:15:00'
      mem: 16G
    writeback:
      ntasks: 1
      time: '00:20:00'
      mem: 16G
    post.state:
      ntasks: 1
      time: '00:20:00'
      mem: 8G
