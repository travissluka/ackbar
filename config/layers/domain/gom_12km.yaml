# The Gulf of Mexico at 1/8 degree: the science domain.
#
# 174 x 111 x 36 over 98.1W-76.4W, 18N-32N. One simulated day costs about 30
# seconds on 8 PEs against 178 for om_1deg, a measured 6.3x, which is the price
# of a domain whose mesoscale is worth assimilating into.
#
# This is the one to draw conclusions from. At 1/8 degree the spacing is about
# 12 km against a first baroclinic Rossby radius of 35 to 45 km in the Gulf, so
# the Loop Current resolves and sheds rings, and altimetry has something real to
# correct. gom_25km is four times cheaper and does not.
#
# Resolution names are in kilometres because the source configurations were named
# in fractions of a degree with ambiguous digits, and `08deg` there meant 1/8
# degree, which is this, at about 12 km. Kilometres cannot be misread.
#
# Everything not stated here comes from `domain/common/gom.yaml`, which this
# layer inherits: the stock case, the static roots, the level count, and every
# task's resources but the two that scale with the grid.

inherit:
  - domain/common/gom

vars:
  # The directory name under the static root, and the domain's own name. The
  # common layer builds `mom6_input_dir` and `domain_static` from it.
  domain_slug: gom_12km
  # Which MOM_override under `config/model/mom6sis2/domain/gom/` makes this
  # domain this grid. Not derivable from the slug: one is named for the
  # spacing in kilometres and the other for the fraction of a degree.
  domain_resolution: 12km

domain:
  name: gom_12km

  # The two that scale with the grid. Everything else is the common layer's.
  resources:
    forecast:
      time: '00:40:00'
      mem: 12G
    forecast.ext:
      time: '03:00:00'
      mem: 12G
