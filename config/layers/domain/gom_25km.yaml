# The Gulf of Mexico at 1/4 degree: the plumbing domain.
#
# 87 x 56 x 36 over 98.1W-76.4W, 18N-32N. One simulated day costs about 6
# seconds on 8 PEs against 178 for om_1deg, so a cycling experiment that took an
# afternoon on the global domain takes minutes here. That is what this domain is
# for: exercising the workflow, not the science.
#
# It is deliberately *not* the domain to draw conclusions from. At 1/4 degree
# the grid spacing is about 25 km against a first baroclinic Rossby radius of 35
# to 45 km in the Gulf, so the Loop Current is barely permitted and will not shed
# rings properly. An analysis here has very little mesoscale to correct, which is
# exactly the signal a DA benchmark exists to measure. Use gom_12km for anything
# whose answer matters, and see docs/domains.md.
#
# Resolution names are in kilometres because the source configurations were named
# in fractions of a degree with ambiguous digits, and `025deg` there meant 1/25
# degree rather than a quarter. Kilometres cannot be misread and sort the right
# way round.

vars:
  # The stock MOM6-SIS2 configuration, in this repository, because MOM6-examples
  # ships no Gulf of Mexico setup and this one is therefore ours. Shared by
  # every Gulf resolution: the four imported configurations were 77 identical
  # MOM6 parameters apiece plus 26 that differed, and keeping four copies of the
  # 77 is how they drifted apart in the first place. What makes this domain this
  # resolution is in its own MOM_override, which is therefore also the readable
  # list of how the Gulf domains disagree.
  mom6_base_dir: $(ackbar_root)/config/model/mom6sis2/domain/gom/common

  # The data half, out of the repository. Grid, bathymetry, initial condition
  # and open boundary conditions, plus a symlink to the shared forcing stage.
  mom6_input_dir: $(static_root)/domain/gom_25km/INPUT

  # The coupler timestep this domain has always run at.
  mom6_dt_cpld: 3600

  # What ACKBAR changes about the shared configuration: the parameters that make
  # this domain this resolution, and the bug-retention flags it turns off on
  # every domain.
  mom6_override_dir: $(ackbar_root)/config/model/mom6sis2/domain/gom/25km

  # Where this domain's offline stages land: the gridspec today, the
  # background error parameters once they are built. A var as well as a
  # `domain.static` key, because the da layer names files under it and
  # cannot know which domain it is being merged with.
  domain_static: $(static_root)/static/gom_25km

  # Vertical levels the background error's diffusion parameters are
  # calibrated on, which is this domain's NK. Here rather than in the da
  # layer because a B built for the wrong number of levels is wrong
  # whatever the solver says, and because the da layer is shared by every
  # domain.
  diffusion_levels: 36

domain:
  name: gom_25km

  static: $(domain_static)

  resources:
    default:
      ntasks: 1
      time: '00:10:00'
      mem: 4G

    # 8 PEs is this machine's physical core count, not a property of the domain.
    # 87 x 56 does not really justify eight of them, and the measured speedup
    # over om_1deg is 28x rather than the 38x the grid sizes alone predict,
    # because the subdomains get too small for the halo exchange to pay. It is
    # still the fastest thing available and there is no reason to leave cores
    # idle. No layout: MOM6 decomposes for itself.
    forecast:
      ntasks: 8
      time: '00:20:00'
      mem: 8G
    forecast.ext:
      ntasks: 8
      time: '01:00:00'
      mem: 8G
    da:
      ntasks: 8
      time: '00:30:00'
      mem: 16G
    hofx:
      ntasks: 8
      time: '00:10:00'
      mem: 8G
    b.vt:
      ntasks: 8
      time: '00:10:00'
      mem: 8G
    recenter:
      ntasks: 8
      time: '00:10:00'
      mem: 8G
    writeback:
      ntasks: 1
      time: '00:10:00'
      mem: 8G
    post.state:
      ntasks: 1
      time: '00:10:00'
      mem: 4G
