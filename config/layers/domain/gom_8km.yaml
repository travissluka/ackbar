# The Gulf of Mexico at 1/12.5 degree: the eddy-resolving domain.
#
# 271 x 173 x 25 over 98.1W-76.4W, 18N-32N. Not yet timed; the grid is 3.7x
# gom_12km's horizontal points but has 25 vertical levels rather than 36, so
# expect roughly 2.5x its cost per simulated day and re-measure before relying
# on that.
#
# The only Gulf domain with a different vertical coordinate: NK = 25 on
# hycom1_25.nc, where the other three use 36 on hycom1_36.nc. That is a real
# difference and not drift, so it lives in this domain's MOM_override with the
# grid. It also means an initial condition or a gridspec built here is not
# interchangeable with the others in any way beyond the horizontal.
#
# Resolution names are in kilometres because the source configurations were named
# in fractions of a degree with ambiguous digits, and `012deg` there meant
# 1/12.5 degree, which is this, at about 8 km. Kilometres cannot be misread.

vars:
  # The stock MOM6-SIS2 configuration, in this repository, because MOM6-examples
  # ships no Gulf of Mexico setup and this one is therefore ours. Shared by
  # every Gulf resolution: the four imported configurations were 77 identical
  # MOM6 parameters apiece plus 26 that differed, and keeping four copies of the
  # 77 is how they drifted apart in the first place. What makes this domain this
  # resolution is in its own MOM_override, which is therefore also the readable
  # list of how the Gulf domains disagree.
  mom6_base_dir: $(ackbar_root)/config/model/mom6sis2/domain/gom/common

  # The data half, out of the repository. Grid, bathymetry, initial condition
  # and open boundary conditions, plus a symlink to the shared forcing stage.
  mom6_input_dir: $(static_root)/domain/gom_8km/INPUT

  # The coupler timestep this domain has always run at.
  mom6_dt_cpld: 1800

  # What ACKBAR changes about the shared configuration: the parameters that make
  # this domain this resolution, and the bug-retention flags it turns off on
  # every domain.
  mom6_override_dir: $(ackbar_root)/config/model/mom6sis2/domain/gom/8km

domain:
  name: gom_8km

  static: $(static_root)/static/gom_8km

  resources:
    default:
      ntasks: 1
      time: '00:10:00'
      mem: 4G

    # 8 PEs is this machine's physical core count, not a property of the
    # domain. No layout: MOM6 decomposes for itself from the PE count.
    forecast:
      ntasks: 8
      time: '01:20:00'
      mem: 16G
    forecast.ext:
      ntasks: 8
      time: '06:00:00'
      mem: 16G
    da:
      ntasks: 8
      time: '00:30:00'
      mem: 16G
    hofx:
      ntasks: 8
      time: '00:10:00'
      mem: 8G
    b.vt:
      ntasks: 8
      time: '00:10:00'
      mem: 8G
    recenter:
      ntasks: 8
      time: '00:10:00'
      mem: 8G
    writeback:
      ntasks: 1
      time: '00:10:00'
      mem: 8G
    post.state:
      ntasks: 1
      time: '00:10:00'
      mem: 4G
