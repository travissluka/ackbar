# The Gulf of Mexico at 1/25 degree: the expensive one.
#
# 541 x 346 x 36 over 98.1W-76.4W, 18N-32N. This is the only Gulf domain that
# costs *more* than om_1deg rather than less: 4.7x more per simulated day by
# grid size and timestep, since DT = 300 buys 288 steps a day over 6.7 million
# cells. It is here for the science that needs 4 km, not for iterating.
#
# Submesoscale resolving, and the first Gulf domain where the Loop Current front
# and its filaments are represented rather than parameterised. Also the first
# where a cycling experiment is an overnight job rather than a coffee break, so
# develop on gom_25km and confirm here.
#
# Resolution names are in kilometres because the source configurations were named
# in fractions of a degree with ambiguous digits, and `025deg` there meant 1/25
# degree, which is this, at about 4 km, not a quarter degree. That single
# ambiguity is why this project renamed them.
#
# Everything not stated here comes from `domain/common/gom.yaml`, which this
# layer inherits: the stock case, the static roots, the level count, and every
# task's resources but the two that scale with the grid.

inherit:
  - domain/common/gom

vars:
  # The directory name under the static root, and the domain's own name. The
  # common layer builds `mom6_input_dir` and `domain_static` from it.
  domain_slug: gom_4km
  # Which MOM_override under `config/model/mom6sis2/domain/gom/` makes this
  # domain this grid. Not derivable from the slug: one is named for the
  # spacing in kilometres and the other for the fraction of a degree.
  domain_resolution: 4km
  # Half the coarse domains' coupler timestep, which this grid needs.
  mom6_dt_cpld: 1800

domain:
  name: gom_4km

  # The two that scale with the grid. Everything else is the common layer's.
  resources:
    forecast:
      time: '04:00:00'
      mem: 32G
    forecast.ext:
      time: '12:00:00'
      mem: 32G
