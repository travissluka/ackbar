# ACKBAR's copy of `soca/test/testinput/obsop_name_map.yml`, for the same reason
# the fields metadata is copied: the bundle's is test data, and an observer that
# reads it depends on a path inside a submodule.
#
# What it does: maps an observation variable name to the GeoVaLs name the
# operator should interpolate. `seaSurfaceTemperature` is the observation, and
# `sea_surface_temperature` is the model field, which exists only because the
# fields metadata gives `sea_water_potential_temperature` that `name surface`.
# The alias file and the fields metadata therefore have to agree, and neither
# one says so.
variable maps:
  - name: depthBelowWaterSurface
    alias: ocean_depth
  - name: waterTemperature
    alias: sea_water_temperature
  # Not in the bundle's copy, and the OSSE is why it is here. The archive samples
  # its profiles straight out of the truth's `Temp`, which is MOM6's prognostic
  # and is *potential* temperature. Assimilating those as `waterTemperature`
  # would put SOCA's `InsituTemperature` operator in the loop, which converts the
  # background's potential temperature to in situ, and the departure would then
  # be between two different quantities: the conversion is 0.1 to 0.15 K by a
  # thousand metres against a declared error of 0.05 K there, so every deep level
  # of every cast would carry a systematic two to three sigma bias that nothing
  # in the workflow reports as one.
  #
  # A real float reports in situ temperature and `InsituTemperature` is the right
  # operator for one. It is the wrong operator for these, and if it is wanted the
  # fix belongs in the archive, converting on the way out, rather than here.
  - name: waterPotentialTemperature
    alias: sea_water_potential_temperature
  - name: seaSurfaceTemperature
    alias: sea_surface_temperature
  - name: salinity
    alias: sea_water_salinity
  - name: seaSurfaceSalinity
    alias: sea_surface_salinity
  - name: seaIceFraction
    alias: sea_ice_area_fraction
  - name: waterSurfaceZonalVelocity
    alias: surface_eastward_sea_water_velocity
  - name: waterSurfaceMeridionalVelocity
    alias: surface_northward_sea_water_velocity
  - name: seaSurfaceChlorophyllMassConcentration
    alias: sea_surface_chlorophyll
  - name: oceanSurfaceBiomassContent
    alias: sea_surface_biomass_in_p_units
  - name: waveHeightSignificant
    alias: sea_surface_wave_significant_height