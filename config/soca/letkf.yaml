# soca_letkf.x: assimilate every member of one cycle's ensemble.
#
# See `config/soca/hofx.yaml` for the rules this file follows. Every $(SLOT) is
# filled by `letkf_config` in `ackbar/soca.py`.
#
# The same construction as the variational document with one structural
# difference: the background is an *ensemble*, one state per member, built as an
# explicit list rather than oops's `members from template`. See `member_states`
# for why the template form is the one that quietly goes wrong.
#
# **This is the solver half only.** The departures were computed by
# `config/soca/hofx_ens.yaml`, one run per member, and merged into one file per
# observer; `driver.read HX from disk` below is what makes this application read
# them instead of computing them. `docs/design.md` has why the split exists.
#
# The consequence worth stating here: the background is one state per member at
# the analysis time whatever the window type is. A four-dimensional filter's
# four dimensions are entirely in the departures, and the weights they produce
# are applied to the state at the analysis time. So 4D costs this application
# exactly what 3D costs it, and there is one analysis to write back rather than
# one per sub-window.

geometry: $(GEOMETRY)

time window:
  begin: '{{window_begin}}'
  length: '{{window_length}}'

background:
  members: $(MEMBER_BACKGROUNDS)

observations:
  observers: $(OBSERVERS)

# The localization and the solver, from `solver.local ensemble DA`. This is the
# science of an ensemble filter and belongs entirely to the layer.
local ensemble DA: $(LOCAL_ENSEMBLE_DA)

# Every flag here is paired with an output block below, and
# `oops::LocalEnsembleDA` throws by name when a flag is set and its block is
# absent, which is the one failure in this document that is loud. The two that
# are not loud are the two that matter:
driver:
  # The ensemble H(x) comes from the merged departure files named in the
  # observers above. Not an option: the observers here carry no filters, so an
  # application that recomputed H(x) would apply no quality control at all.
  read HX from disk: true
  # `oman`, and **the thing that writes the departure files at all**.
  #
  # `oops::LocalEnsembleDA` saves the obs space only when it computed something
  # into it: `!read HX from disk || do posterior observer`. With the departures
  # read from disk, turning this off means the application exits 0 having
  # written no observation output whatsoever, `ombg` included. That is not a
  # trade of `oman` for nothing, it is the loss of every departure the cycle
  # produced, and `post.obs` then has nothing at all to read.
  #
  # What it is worth knowing about the number: the posterior observer evaluates
  # the analysis, which this application holds as a single state at the window's
  # centre. In a 3D window that is the same comparison `ombg` got. In a
  # four-dimensional one it is not, since `ombg` came from the whole trajectory.
  #
  # **`soca_var.x` does exactly the same thing in an FGAT window**, which is
  # what settles it. `CostFctFGAT::doLinearize` sets `fgat_` only on iteration
  # 0, and `finishLinearize` then clears it and replaces the background and
  # first guess with the state at the midpoint, so every later `runNL` takes the
  # single-state branch. So 3D-FGAT's `oman` is a 3D evaluation at the centre
  # against a 4D `ombg`, and has been all along. Leaving this on makes an
  # ensemble filter's `oman` mean the same thing as the variational one's, which
  # is what makes the two comparable. `docs/analysis.md` says so where the
  # number is read.
  do posterior observer: true
  # Without this the control member has no analysis at all: in a pure LETKF the
  # posterior mean *is* the control's answer, since ACKBAR does not separately
  # compute one.
  save posterior mean: true
  save posterior ensemble: true
  save posterior mean increment: true
  # Prior and posterior spread. Not decoration: an ensemble filter fails in two
  # ways that look nothing alike in the departures and identical in any single
  # analysis, the spread collapsing until every later cycle ignores its
  # observations, or the spread growing until the filter chases noise. These two
  # side by side are the record of which is happening, and nothing else in the
  # workflow produces it.
  save prior variance: true
  save posterior variance: true

# One block per thing saved. Each carries `date`, the reference the ensemble
# filenames are formed against; it is the analysis time, so the offset in them
# is zero. The member analyses take `type: ens`, which is the only value
# `soca_genfilename` puts a member index in: any other has every member writing
# one filename in turn while the application exits zero.
output: $(ANALYSIS_OUTPUT)
output increment: $(INCREMENT_OUTPUT)
output variance prior: $(SPREAD_PRIOR_OUTPUT)
output variance posterior: $(SPREAD_POSTERIOR_OUTPUT)
