# soca_hofx3d.x: evaluate a set of observers against one background state.
#
# The shape of the document lives here; the values live in `ackbar/soca.py`,
# which fills every $(SLOT) below. Nothing in this file is a value an experiment
# states somewhere else, which is the rule that makes a template safe: there is
# nothing here for a configuration to drift away from.
#
# `{{...}}` is the job-time pass, resolved from the closed table in
# `ackbar/config/jobtime.py`. `$(UPPERCASE)` is filled by `hofx_config`.

geometry: $(GEOMETRY)

# The background. For a run with no analysis this is the previous cycle's
# forecast, and for cycle 1 it is the initial condition materialized into
# `rst/0`; either way it is a directory the driver locates and a restart file
# the model layer names.
#
# `$(BACKGROUND_DIR)` carries a trailing separator, because SOCA concatenates
# basename and filename without one.
state:
  read_from_file: 1
  basename: $(BACKGROUND_DIR)
  ocn_filename: $(RESTART_FILE)
  date: '{{current_cycle}}'
  state variables: $(STATE_VARIABLES)

# The window the observers select on, which is the cycle's own and not
# something hofx gets to choose.
time window:
  begin: '{{window_begin}}'
  length: '{{window_length}}'

observations:
  observers: $(OBSERVERS)
