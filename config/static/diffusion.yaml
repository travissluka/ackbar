# Correlation length scales for the background error's diffusion operator.
#
# Read by `tools/soca-diffusion.sh`, which is offline and keyed on domain, and
# by nothing in the workflow. An experiment names the *product* of this file
# (`$(domain_static)/diffusion/*.nc`) and never these numbers, for the same
# reason it names the gridspec rather than the gridgen configuration: every
# experiment on a domain should be comparing analyses against one B, not against
# whatever B its own configuration happened to describe.
#
# That is what `config/static/` is for and what separates it from
# `config/layers/`. A layer is read by `ackbar create` and becomes part of an
# experiment's frozen configuration; a file here is read by a tool, before any
# experiment exists, and produces something under `domain.static` that every
# experiment on the domain then shares.
#
# Not per domain, and that is deliberate rather than unfinished. Every length
# here is relative to something the grid already knows: the local Rossby radius,
# the local cell size, or the local mixed layer. A 4 km grid and a 25 km grid
# reading this file get different scales in metres because `rossby_radius`, `dx`
# and `MLD` differ, not because someone remembered to write a second copy. Add a
# `domains:` override the first time a domain genuinely needs one.
#
# These are the numbers `tools/soca-diffusion.sh` reads. Changing one means
# recalibrating the domain and rebuilding every B that was written from it.

# ------------------------------------------------------------------------------
# Horizontal, in metres. One entry per output file, and the name is the file:
# `corr_hz` becomes `$(domain_static)/diffusion/corr_hz.nc`.
#
#   scale = clip(rossby_radius * `rossby mult`,
#                min = max(dx, dy) * `min grid mult`,
#                max = `max`)
#
# then smoothed by itself, so that the diffusion coefficient does not have a
# sharper gradient than the fields it is meant to correlate.
#
# The floor is what keeps this usable at high latitude and on a coarse grid,
# where the Rossby radius falls below the cell size and an unfloored scale
# would ask the operator to correlate a cell with itself. The ceiling is what
# keeps it usable at the equator, where the radius runs past 250 km and the
# explicit scheme's iteration count runs with it.
# ------------------------------------------------------------------------------
horizontal:

  # Temperature and salinity, and anything else that is not sea surface height.
  corr_hz:
    rossby mult: 1.0
    min grid mult: 1.5
    max: 250.0e3

  # Sea surface height, which is dynamically broader than the tracers: it
  # integrates the whole column, so a single altimeter track informs a wider
  # patch than a single Argo profile at the same place does.
  #
  # 1.5 is also the cheap end of the choice: the explicit horizontal scheme's
  # iteration count goes as the square of the scale measured in grid cells, and
  # this is the group that sets the price, so 1.5 costs a little over half what
  # 2.0 does.
  corr_hz_ssh:
    rossby mult: 1.5
    min grid mult: 2.0
    max: 350.0e3

  # Localization for an ensemble covariance. A different quantity from the two
  # above, and here because it is built by the same operator out of the same
  # grid: those are correlation lengths for a *modelled* background error, this
  # is the radius beyond which a correlation *sampled* from twenty members is
  # taken to be noise and tapered away.
  #
  # Deliberately wider than `hz`, and the reason is worth stating because
  # getting it wrong is quiet. Localizing tighter than the true correlation
  # length throws away exactly the long range structure the ensemble is there to
  # provide, and the symptom is an ensemble component that appears not to be
  # contributing rather than anything that looks like a mistake.
  #
  # One and a half Rossby radii, floored at two grid cells, ceilinged where
  # `corr_hz_ssh` is. Read by the `localization` block in
  # `config/layers/da/hybrid.yaml` and by nothing else.
  #
  # 1.5 rather than the 2.0 this started at, and it is a science call rather
  # than a tuning sweep: it is the value the first hybrid runs are configured
  # with, so it is the one the ensemble component's contribution will be judged
  # at. Changing it means rebuilding `loc_hz.nc` with
  # `tools/soca-diffusion.sh`, because the multiplier lives here and the
  # operator that reads it is a file.
  loc_hz:
    rossby mult: 1.5
    min grid mult: 2.0
    max: 350.0e3

# ------------------------------------------------------------------------------
# Vertical, in *model levels* rather than metres, because that is the coordinate
# the operator diffuses along and MOM6's layers are not evenly spaced.
#
# The scale at the surface is the number of levels in the mixed layer, taken
# from `MLD` in the restart and interpolated down to `min` at the bottom of the
# mixed layer, so that the analysis spreads freely inside a well mixed column
# and barely at all across the pycnocline. Below that it is `min` everywhere.
# It is not capped: see the note on `max` below.
#
# Written to `$(domain_static)/diffusion/corr_vt.nc`, and read only by the group that
# holds the tracers. Sea surface height is a single level and has no vertical
# correlation to describe.
# ------------------------------------------------------------------------------
vertical:
  min: 1.5

  # There is deliberately no `max`. A ceiling here would be a cost control
  # rather than a statement about the ocean, and with the implicit scheme there
  # is no cost to control: its iteration count is a number of tridiagonal solves
  # down each column and does not depend on the scale at all. The explicit
  # scheme grows with the square of the scale in levels, so an 80 level mixed
  # layer in a 75 level column would price the whole domain; implicit removes
  # that, and a deep mixed layer gets the vertical correlation it actually has.
  #
  # Two is saber's minimum; it must be even.
  #
  # This number has to match `solver.background error` in
  # `config/layers/da/variational.yaml`: the normalization written here is
  # computed with the operator configured here, and reading it back through a
  # differently configured operator produces a B that is silently unnormalized.
  # `tests/test_diffusion.py` is what stops the two drifting apart.
  method: implicit
  iterations: 2

# ------------------------------------------------------------------------------
# How many randomizations the horizontal normalization is estimated from. This
# is the whole cost of the calibration: the rest is one pass over the grid.
#
# The SOCA test configuration uses 1000 and says in a comment that the real
# world wants 1e4. The normalization error falls as 1/sqrt(iterations), so this
# buys accuracy slowly, and an under-normalized B shows up as an analysis whose
# increment amplitude is wrong by a percent or two rather than as anything that
# looks like a failure.
#
# This is the number for science. `tools/soca-diffusion.sh --iterations N`
# overrides it downwards to prove the stage runs at all, and the tests use that;
# a calibration built that way is not one anybody should assimilate through.
# The generated `calibrate.yaml` is copied next to the output because it is the
# only thing that records which of the two a given `corr_hz.nc` is.
# ------------------------------------------------------------------------------
normalization iterations: 10000
