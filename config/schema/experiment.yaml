# ACKBAR's own schema for a fully merged experiment configuration.
#
# Two jobs in one document:
#   1. validate the keys ACKBAR owns, strictly
#   2. declare how lists merge, via x-ackbar-merge-key
#
# Keeping both here means the merge rules cannot drift away from the shape they
# describe. JSON Schema validators ignore x- annotations.
#
# Strictness is deliberate and uneven. Where ACKBAR owns the keys, unknown ones
# are an error, because a typo that is silently ignored is exactly the failure
# this document exists to prevent. Where the subtree is verbatim JEDI config,
# unknown keys are allowed, because ACKBAR's schema describes ACKBAR's config
# and is not a model of OOPS.

$schema: https://json-schema.org/draft/2020-12/schema
title: ACKBAR experiment
type: object
required: [experiment, domain, cycle, model, solver]
additionalProperties: false

properties:

  experiment:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        # Part of every job name and --comment, so it has to survive sacct and
        # shell quoting intact.
        pattern: '^[A-Za-z][A-Za-z0-9_-]*$'
        maxLength: 32
      description: { type: string }

  vars:
    # Experiment-time substitution values, referenced as $(name). Free form by
    # nature: a layer introduces the variables it needs. What forced it to
    # exist is the observer layers, whose filter chains and localization blocks
    # hold values an experiment must be able to move without restating the
    # block around them. Filter chains and localization lists have no merge key,
    # so they replace wholesale, and the only way to reach one value inside one
    # is to make it a substituted symbol. That is why substitution runs after
    # the merge: `$(adt_localization_scale)` is declared in `obs/common/adt.yaml`
    # and an experiment with a smaller ensemble overrides it there.
    type: object
    additionalProperties: true

  observation bodies:
    # The half of an observer that a family of platforms has in common, by name.
    #
    # `observations` merges keyed on `obs space.name`, so a layer reaches an
    # observer only by naming it, and a layer holding a body with no platform of
    # its own has nothing to merge into. A platform layer points at one of these
    # with `$inherit:` and inherits the layer that declares it;
    # `ackbar/config/bodies.py` merges the body under the observer and drops the
    # key, so what reaches UFO is a complete observer either way.
    #
    # Free form below the name, because the value is a partial observer and an
    # observer is UFO's config, not ACKBAR's.
    #
    # This key survives into the frozen config. That is deliberate: the frozen
    # config is the record of what the experiment was built from, and a key it
    # was written with going missing would make that record disagree with the
    # layers frozen beside it.
    type: object
    additionalProperties: { type: object }

  domain:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: { type: string }
      # Where this domain's offline static stage lives: one directory, shared
      # read-only by every experiment on the domain. A directory rather than a
      # map of products because there is one product so far, and naming the
      # directory is what lets a second arrive without a schema change.
      static: { type: string }
      resources:
        # Per-task resources live in the domain layer, because domain is what
        # actually drives the difference between OM_1deg and OM4_025. The site
        # layer supplies only partition, account, launcher, roots and limits.
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            # `ntasks` is the only thing a domain says about PEs. There is no
            # `layout`: MOM6 decomposes for itself from the PE count it is
            # given, and it picks what a person would (4x2 at 8 PEs, 3x2 at 6,
            # 4x3 at 12, 1x5 at the awkward prime). A layout in configuration
            # would be a second place for the PE count to live and a thing to
            # get wrong on every machine with a different core count.
            ntasks: { type: integer, minimum: 1 }
            time: { type: string, pattern: '^(\d+-)?\d{1,2}:\d{2}(:\d{2})?$' }
            mem: { type: string, pattern: '^\d+[KMGT]?$' }

  cycle:
    type: object
    required: [start, length, count]
    additionalProperties: false
    properties:
      # ISO 8601, and `parse_instant` is the real gate: JSON Schema `format` is
      # annotation-only, so this line refuses nothing on its own. What that
      # accepts is looser than it looks. A bare date and a naive form are both
      # legal and are read as UTC; an offset form is *converted* to UTC, which
      # silently moves every cycle directory name, and those names are how an
      # experiment joins to its truth archive. Write the Z form.
      start: { type: string, format: date-time }
      length: { type: string, pattern: '^P' }
      count: { type: integer, minimum: 1 }
      throttle: { type: integer, minimum: 1 }

  # What survives the cycling. Two rules, and they answer different questions.
  #
  # `keep_cycles` is the rolling window: how many completed cycles behind the
  # current one keep their model state under `run/<date>/`. One is the default
  # and the tightest correct answer, since cycle n's forecast reads cycle n-1's
  # restarts and nothing reads further back. Raise it for headroom while an
  # experiment is being healed repeatedly.
  #
  # `keep_every` is the pin, and it is what makes a long experiment branchable:
  # `model.initial_condition` can name another experiment's
  # `run/<date>/rst/mem000` and start a variant from the middle of it. Without
  # it a fifty cycle run holds only its last two states the moment it finishes.
  # It pins `rst` alone; `ana` and `slot` at the same date carry nothing the
  # pinned `rst` and the compressed `ana/`, `bkg/` products do not, and they are
  # the two that grow fastest.
  #
  # A duration rather than a pattern matched against the date. A pattern
  # changes meaning when the date format does and cannot express "every three
  # days" at all; a duration divides. Cycle n is pinned when its analysis time
  # is an exact multiple of it after `cycle.start`, so cycle 1 is always pinned
  # and cycle 0, the materialized initial condition, is never reaped anyway.
  cleanup:
    type: object
    additionalProperties: false
    properties:
      keep_cycles: { type: integer, minimum: 1 }
      keep_every: { type: string, pattern: '^P' }

  model:
    type: object
    required: [name]
    properties:
      name:
        enum: [mom6sis2, persistence, stub]
      # Everything else under model is the model's own namelist-shaped config,
      # which varies by model and is not ACKBAR's to describe.
    allOf:
      - if:
          properties: { name: { const: stub } }
          required: [name]
        then:
          required: [stub]
          properties:
            stub:
              type: object
              required: [seconds]
              additionalProperties: false
              properties:
                seconds: { type: number, minimum: 0 }
                bytes: { type: integer, minimum: 0 }
                fail:
                  # Deterministic fault injection, the whole point of the stub.
                  #
                  # Each entry is a selector `<cycle>.<task>[.<member>]`, every
                  # field a shell glob: `2.forecast.3`, `*.da.*`,
                  # `3.forecast.ext.*`. Same job, same fault, every time, so a
                  # healed attempt reproduces the failure it is meant to fix
                  # rather than passing by luck.
                  #
                  # An impossible memory request is not here, because it is a
                  # resources value rather than a fault: an experiment tests it
                  # by asking for more memory than the partition has. Nor is "a
                  # member that never starts", which is what exit_nonzero on one
                  # array element does to its aftercorr child.
                  type: object
                  additionalProperties: false
                  properties:
                    exit_nonzero: { type: array, items: { type: string } }
                    overrun_time: { type: array, items: { type: string } }
                    overrun_memory: { type: array, items: { type: string } }
                    write_nothing: { type: array, items: { type: string } }
                    requeue: { type: array, items: { type: string } }

  solver:
    # Three keys ACKBAR owns and validates strictly, because they are the DA
    # axes: they decide which tasks exist and how they are wired. Everything
    # else here is the analysis application's own config, and follows the same
    # rule as `model` and the body of an observer: named, so a typo in an axis
    # is still an error, and unvalidated inside, because this is SABER and OOPS
    # config and ACKBAR's schema is not a model of either.
    #
    # `background error` and `variational` are the only two parts of the var
    # document that are not derivable from something the experiment already
    # states. Everything else soca_var.x reads, ACKBAR builds: the geometry
    # from the model layer, the background from the previous cycle's restart
    # set, the time window from the cycle, the observers from `observations`,
    # and the departure diagnostics, which are not optional here because an
    # analysis that writes no `ombg`/`oman` leaves `post.obs` with nothing and
    # looks healthy the whole way through.
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        enum: [none, variational, letkf]
      covariance:
        enum: [static, ensemble, hybrid]
      # The assimilation window: what the analysis compares against, and over
      # how long. Centred on the analysis time, always, because that is where
      # the analysis is written: `CostFctFGAT::doLinearize` saves the state at
      # `timeWindow_.midpoint()` and `finishLinearize` replaces the background
      # and the first guess with it, so an off-centre window would produce an
      # analysis valid at a time no cycle starts from.
      #
      # `length` defaults to the cycle length, which is the case where
      # consecutive windows tile the experiment with no gap and no overlap.
      # A shorter one drops the observations that fall between windows; a
      # longer one assimilates some of them twice. Both are real experiments
      # and neither is the default.
      #
      # `type` is what reads the window rather than how long it is. `3d`
      # compares every observation in it against one background at the centre;
      # `fgat` and `4d` compare each against the sub-window state nearest its
      # own time, which is what `forecast.slots` writes. Those two therefore
      # require it, and make the forecast overshoot the next analysis time by
      # half a window so that the states at the far end of that window exist.
      window:
        type: object
        required: [type]
        additionalProperties: false
        properties:
          type:
            enum: ['3d', fgat, '4d']
          length: { type: string, pattern: '^P' }
      # What the analysis solves for. Deliberately not `model.state variables`:
      # that list is what gets read out of the restart set and interpolated for
      # the observers, and the background needs fields the analysis does not
      # touch (cell thickness, mixed layer depth, depth) because the background
      # error blocks read them. Conflating the two gives an analysis that
      # either cannot build its background error or writes back fields it never
      # solved for.
      analysis variables:
        type: array
        items: { type: string }
      # The largest increment writeback will put into the restart, per analysis
      # variable, as a soft bound rather than a clip: `ackbar.writeback` applies
      # `L*tanh(x/L)`. Absent means unlimited, which is what a variational
      # experiment runs with, because a covariance model cannot produce an
      # increment far outside its own standard deviations and a twenty-member
      # sample covariance can. Keyed by JEDI variable name; a variable with no
      # entry is unbounded.
      increment limits:
        type: object
        additionalProperties: { type: number, exclusiveMinimum: 0 }
      # How much of the increment writeback applies, as a fraction. Absent means
      # all of it. The crude form of IAU: what destabilises the model is the
      # speed of the correction rather than its size, and until the increment
      # can be spread across the forecast, scaling it is what is available.
      # Preferred over a tighter bound because a scalar shrinks every gradient
      # by the same factor and invents none, where a bound changes the shape.
      # Either a number, constant for every cycle, or a ramp from `first` at
      # cycle 1 to 1.0 at cycle `cycles`. The ramp is the useful form: the shock
      # is a spin-up transient, largest at cycle 1 where the background is the
      # ensemble's initial condition, and a constant low enough to survive that
      # throws away most of the analysis for every cycle after it.
      increment relaxation:
        oneOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 1
          - type: object
            required: [first, cycles]
            additionalProperties: false
            properties:
              first: { type: number, exclusiveMinimum: 0, maximum: 1 }
              cycles: { type: integer, minimum: 2 }
      # How fast the velocity increment's transport may move a column's free
      # surface, in fractions of that column's own depth per hour. One number
      # covers a 10 m shelf cell and a 3000 m basin, because it is scaled by the
      # water there is rather than by a depth threshold. See `ackbar.writeback`.
      increment divergence limit:
        type: number
        exclusiveMinimum: 0
      # What the analysis reads out of the restart set, which is a superset of
      # what it solves for: `SOCAParametricOceanStdDev` reads mixed layer
      # thickness and depth to build the standard deviations, and never writes
      # them. Stated rather than derived as `analysis variables` plus two names,
      # because which extra fields are needed is a property of the background
      # error blocks configured below, and hardcoding the two in the builder is
      # a thing to get wrong the first time that block changes.
      background variables:
        type: array
        items: { type: string }
      # The static B, as a SABER block. Verbatim. Present for a static or a
      # hybrid covariance and unused by a pure ensemble one.
      background error:
        type: object
        additionalProperties: true
      # The ensemble component of the B: what localizes it, and nothing else.
      # The members are not here and never will be. They are the previous
      # cycle's forecasts, one directory per member, and a layer that named them
      # would be a layer that has to know the on-disk layout and the cycle
      # number.
      ensemble error:
        type: object
        additionalProperties: true
        required: [localization]
        properties:
          localization:
            type: object
            additionalProperties: true
      # How much of each component a hybrid takes. Two numbers, both required,
      # neither defaulted: halving the static B and adding half an ensemble is
      # the textbook hybrid and is therefore not the right answer for any
      # particular ocean, and an experiment that does not say what it weighted
      # them at is one whose result cannot be attributed to either.
      hybrid weights:
        type: object
        additionalProperties: false
        required: [static, ensemble]
        properties:
          static: { type: number, minimum: 0 }
          ensemble: { type: number, minimum: 0 }
      # Whether the vertical correlation is the domain's offline calibration or
      # is rebuilt every cycle. `cycled` is the only value that changes
      # anything, and stating it is what puts `b.corr_vt` in the graph and switches
      # the analysis onto its output: see `run.vertical_correlation_is_cycled` and
      # `config/layers/da/corr_vt_cycled.yaml`.
      vertical correlation:
        type: string
        enum: [static, cycled]
      # The smallest vertical correlation `b.corr_vt` may produce, in model levels.
      # Required by a cycled experiment and meaningless without one. It repeats
      # `config/static/diffusion.yaml`'s floor because a job cannot read that
      # file; the two have to be kept equal by hand.
      vertical correlation floor:
        type: number
        exclusiveMinimum: 0
      # The weight a cycled experiment puts on this cycle's own scales, the
      # rest coming from what was carried forward. 0 means no rolling average.
      vertical correlation memory:
        type: number
        minimum: 0
        maximum: 1
      # A fixed vertical scale field, read instead of the background's mixed
      # layer. When it is set nothing is computed and nothing is averaged.
      vertical correlation climatology:
        type: string
      # The minimizer and the outer/inner loop structure. Verbatim.
      variational:
        type: object
        additionalProperties: true
      # The ensemble solver and its inflation, which is LETKF's counterpart to
      # `background error` and `variational`: the part of the document nothing
      # else in the experiment implies. What the application is told to *save*
      # is not here, because that is not a choice an experiment gets to make.
      # An analysis that writes no posterior mean leaves the control member
      # with no analysis at all, and one that skips the posterior observer
      # leaves `post.obs` with an `ombg` and no `oman`; both look healthy the
      # whole way through, so ackbar sets the driver.
      local ensemble DA:
        type: object
        additionalProperties: true
      # How the filter spreads observations across ranks. Not in the observer
      # layers, and not in `vars`: a hybrid cycle reads the same observers
      # through two applications that need different answers, so it cannot be
      # one substituted value. ACKBAR sets the variational side to
      # round robin itself; what an experiment chooses is the halo, which has to
      # be at least the largest localization radius any observer uses. See
      # GLOBAL_DISTRIBUTION in ackbar/soca.py.
      ensemble distribution:
        type: object
        additionalProperties: true
        required: [name]
        properties:
          name: { type: string }

      # The observation-space localization the filter applies, attached to every
      # observer by ackbar/soca.py. Here rather than in the observer layers for
      # the same reason as the distribution above, and one more: it belongs to
      # all of them, and a merged configuration can only say that by naming each
      # one. A per-platform list left any platform it did not name unlocalized
      # and invented an observer for every platform it named that the experiment
      # did not carry. An observer that states its own `obs localizations`
      # overrides this.
      ensemble localization:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: true
          required: [localization method]
          properties:
            localization method: { type: string }

    allOf:
      # A variational experiment with no B and no minimizer is not an
      # under-specified experiment, it is a different experiment: the
      # application would take OOPS defaults for both and produce an analysis
      # nobody chose. Same shape as the stub's conditional above, and for the
      # same reason.
      - if:
          properties: { name: { const: variational } }
          required: [name]
        then:
          required:
          - analysis variables
          - background variables
          - variational
      # The static B is required by every covariance that has one, which is
      # every covariance but the pure ensemble. Stated this way round rather
      # than as two conditionals, because `covariance` is optional and its
      # absence means static.
      - if:
          properties:
            name: { const: variational }
            covariance: { enum: [static, hybrid] }
          required: [name]
        then:
          required: [background error]
      # And the ensemble component by every covariance that reads one. A hybrid
      # additionally has to say how the two are weighted; an EnVar does not,
      # because there is only one.
      - if:
          properties:
            name: { const: variational }
            covariance: { enum: [ensemble, hybrid] }
          required: [name, covariance]
        then:
          required: [ensemble error]
      - if:
          properties:
            name: { const: variational }
            covariance: { const: hybrid }
          required: [name, covariance]
        then:
          required: [hybrid weights]
      # LETKF needs no B: its covariance is the ensemble. What it does need is
      # a solver and an inflation, and defaulting either is how an experiment
      # ends up reporting an ensemble that quietly collapsed.
      - if:
          properties: { name: { const: letkf } }
          required: [name]
        then:
          required:
          - analysis variables
          - background variables
          - local ensemble DA
          - ensemble distribution
          # Not `ensemble localization`. It is optional here because the
          # observer bodies carry it: localization is a property of what was
          # measured, so it lives with the platform. A solver layer setting it
          # is making one statement about every observer at once, which only
          # `da/eakf` does. See `_observers` in `ackbar/soca.py`.

  ensemble:
    type: object
    required: [size]
    additionalProperties: false
    properties:
      size: { type: integer, minimum: 1 }
      # Whether a deterministic control runs alongside the ensemble. It is
      # mem000 and it is inside the same member array, not a parallel concept:
      # Splitting the control out into its own concept is what makes every
      # ensemble loop carry a special case. With a control the index set is
      # 0..size, without it 1..size.
      control: { type: boolean }
      # What maintains the ensemble from one cycle to the next, which is
      # A property of the ensemble rather than of the solver: an LETKF's members are maintained by
      # its own analysis, and a hybrid's by something the hybrid does not
      # otherwise contain.
      #
      # `none` is a real answer and not an omission. The members run free and
      # are pulled back onto the deterministic analysis each cycle, which gives
      # the covariance flow dependence without a second filter; what it does not
      # give them is observation information of their own.
      #
      # Which of these are implemented is `ENSEMBLE_SOURCES` in
      # `ackbar/graph/build.py`, and it is checked there rather than here
      # because it is a relation between this key and `solver.covariance`.
      source:
        enum: [none, letkf, eda, offline, perturbation]
      # Where the members start. An offline product like every other initial
      # condition, holding one restart set per member under `mem001` and up,
      # and named separately from `model.initial_condition` rather than derived
      # from it: the control starts from the unperturbed state and the members
      # do not, so the two are different directories and each is stated.
      #
      # Absent means every member starts from the same state, which is an
      # ensemble of zero spread. That is the right answer for an experiment
      # whose spread arrives from somewhere else and the wrong one for an LETKF,
      # where it is a filter with nothing to work with. `tools/ensemble-ic.sh`
      # builds one.
      initial_condition: { type: string }
      # A missing member is routine once members are array elements, so the
      # policy is per experiment and is stated rather than defaulted silently.
      on_missing_member:
        enum: [fail_cycle, run_degraded, replace_from_mean]
      # Stochastic physics in the forecast model, which is what makes one
      # member's *model* differ from another's rather than only its state. A
      # filter removes spread every cycle and a free forecast from a common
      # atmosphere puts back very little, so without something here an ensemble
      # collapses towards its own mean. `ackbar/stochastic.py` says where each
      # scheme acts and why the seed is derived rather than drawn. oSPPT is the
      # only scheme here; that file says which two MOM6 also offers and why
      # neither is carried.
      #
      # Absent is off, and off is byte for byte the model with no generator
      # compiled in at all, so every experiment written before this reproduces.
      # It applies to every member but the control, which is scored.
      #
      # MOM6 only. `model/persistence` and `model/stub` integrate nothing to
      # perturb, and `ackbar validate` says so rather than staging a parameter
      # file nothing reads.
      stochastic:
        type: object
        additionalProperties: false
        required: [seed, sppt]
        properties:
          # What makes this experiment's draws its own. Two experiments that
          # share it draw the same patterns, which is how a controlled
          # comparison is written; two that differ in it are independent.
          #
          # Bounded so the derived seed stays inside the `integer(8)` the
          # pattern generator declares. A cycle date, `20150712`, is the
          # obvious thing to put here and fits.
          seed: { type: integer, minimum: 1, maximum: 99999999 }
          # Perturbs the whole diabatic tendency, so it reaches the column and
          # moves sea level through the thickness.
          sppt:
            type: object
            additionalProperties: false
            required: [amplitude, length_scale, timescale]
            properties:
              # The standard deviation of the *pattern*, which is not the
              # standard deviation of the multiplier the model applies.
              # `run_stochastic_physics_ocn` passes the pattern through
              # `2 / (1 + exp(-x))`, which maps the real line into (0, 2), so
              # the multiplier is bounded by construction and never clipped.
              # Near one that transform is `1 + x/2`, so the delivered spread
              # is half this number, and less than half as the logistic
              # saturates: 0.4 delivers 0.17 here, 0.8 delivers 0.31 and 1.5
              # delivers 0.46. Raising it past about 1 buys progressively
              # less.
              amplitude: { type: number, exclusiveMinimum: 0 }
              # Metres. It is the pattern's decorrelation scale, not the grid's,
              # and a scale below a few cells is smoothed away by the model
              # before it can grow.
              length_scale: { type: number, exclusiveMinimum: 0 }
              # The pattern's AR(1) decorrelation time. Well inside a cycle, or
              # a member's perturbation is one draw held nearly constant.
              timescale: { type: string }

  observations:
    # The list the keyed-merge machinery exists for. The example it used to give
    # was a `da/letkf` layer setting one observer's localization, which is now
    # the anti-pattern: naming platforms there left every platform not named
    # with no localization and invented a phantom observer for every one named
    # that the experiment did not carry. See `da/letkf.yaml`. The machinery is
    # still what lets a layer reach one observer without restating the rest.
    type: array
    x-ackbar-merge-key: obs space.name
    items:
      type: object
      required: [obs space]
      # Everything below an observer is UFO's, not ACKBAR's.
      additionalProperties: true
      properties:
        # ACKBAR's, not UFO's, and gone before UFO sees the observer: the name
        # of a shared body under `observation bodies`, merged in by
        # `ackbar/config/bodies.py`. Validated there rather than here, because
        # the useful error is "no body named that is declared, here is what is"
        # and a schema can only say the value is a string.
        #
        # The sigil is what `$remove` wears and means the same thing: everything
        # else inside an observer is UFO's to read, and a bare `inherit:` here
        # would read like one more thing SOCA acts on. The same word as a
        # layer's own `inherit:`, at a different scope: that one is a list of
        # layer names at the top of a document ACKBAR owns outright.
        $inherit: { type: string }
        # This observer's observation-space localization, read only by an
        # ensemble filter and dropped for every other application. ACKBAR's, not
        # UFO's, hence the sigil: the same body is handed to a variational solve
        # and to hofx, and UFO's own `obs localizations` sitting there would
        # reach an application that does not localize.
        $localization:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [localization method]
        obs space:
          type: object
          required: [name]
          additionalProperties: true
          properties:
            name: { type: string }
            $required: { type: boolean }

  forecast:
    type: object
    additionalProperties: false
    properties:
      # How often the forecast writes a state *inside* its integration, as well
      # as the restart set at the end of it. Absent is the ordinary case and
      # means it writes only that set: a 3D analysis compares every observation
      # in the window against one background, so there is nothing between the
      # endpoints for anything to read.
      #
      # A 4D window is what needs them, and it needs one state per sub-window
      # rather than a trajectory: `cost type: 3D-FGAT` reads them through a
      # `pseudo model` and 4D-Ens-Var reads one list of them per member.
      #
      # The states written are the last window's worth of the forecast, ending
      # at its last step, because that is the window the *next* cycle
      # assimilates in. With `solver.window.type` of `fgat` or `4d` the
      # forecast runs half a window past the next analysis time to produce
      # them; without a window it runs the cycle length, and the states then
      # span the cycle.
      #
      # They are MOM6's own intermediate restarts, `restart_interval` in
      # `coupler_nml`, and deliberately not model history. SOCA reads a state
      # through `fields metadata`, which maps every field to a *restart*
      # variable (`Temp`, `Salt`, `ave_ssh`); a `diag_table` writes the
      # diagnostic names (`temp`, `salt`, `SSH`), which are different strings
      # for the same fields. History would therefore need a second fields
      # metadata, and that file is the model layer's one contract with SOCA.
      #
      # Must divide the cycle length and the window, checked in
      # `ackbar/graph/build.py`.
      slots: { type: string, pattern: '^P' }
      extended:
        type: object
        required: [length, every]
        additionalProperties: false
        properties:
          length: { type: string, pattern: '^P' }
          every: { type: string, pattern: '^P' }
          members: { type: array, items: { type: integer, minimum: 0 } }
          # Two cadences, because the two products want different ones. The
          # difference between them is **retention**, not resolution: both name
          # how often the model writes a state, and the names say which of those
          # writes survives the run.
          #
          # `keep_states` is how often a state is kept, and therefore which
          # leads the state verification has points at: F024, F048, F072 for
          # PT24H. These are full compressed fields and are the expensive
          # product, so daily is usually enough. Without it the run keeps one
          # state, at the end, and a skill curve with one point on it is not a
          # curve.
          #
          # `slots` is how often the model writes a state for the *departures*
          # to be computed against, and wants to be finer: an observation is
          # compared against the trajectory nearest its own time, so a coarse
          # cadence throws away the timing of every observation between two
          # writes. These states are **not** kept: they are reaped once
          # `hofx.ext` has reduced them to departures, so the cost is disk for
          # one cycle rather than disk for the life of the experiment. The word
          # means here what it means in `forecast.slots` above, a state written
          # so an observation can be compared at its own time, which is why it
          # is the same word.
          #
          # Same mechanism for both, and it is `forecast.slots`': FMS dumps in
          # place each time its clock reaches the interval, so every lead costs
          # one write and not a second model run. The model writes at `slots`,
          # and the kept states are the subset of those at `keep_states`.
          #
          # `slots` is not inherited from `forecast.slots` and must not be: that
          # key exists only on a 4D experiment, where it is constrained by the
          # DA window, and a 3D experiment wanting long-forecast departures has
          # nothing there to inherit. Unset, it falls back to `keep_states`, so
          # a forecast naming no slot cadence scores its observations against
          # the states it was keeping anyway.
          #
          # Relations, all checked in `ackbar/graph/build.py`: both divide
          # `length`; `slots` divides `keep_states`, so the kept states really
          # are a subset; `keep_states` is a whole number of cycles, so every
          # kept lead lands on an analysis time and is scored against the same
          # observations the cycling background was.
          keep_states: { type: string, pattern: '^P' }
          slots: { type: string, pattern: '^P' }
