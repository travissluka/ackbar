[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ackbar"
version = "0.0.0"
description = "Assimilation Cycling Kit for Benchmarking And Research"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "jsonschema",
    # Imported at module scope by `ensemble.py` and `writeback.py`, and
    # `cli.py` imports `run.py` imports `ensemble.py`, so these are hard
    # imports of the command itself and not of the analysis path alone.
    # Undeclared, the README's own "needs no scheduler, no JEDI and no model"
    # recipe fails to collect a third of the suite anywhere spack-stack is not
    # already on the path, which is exactly the machine it is addressed to.
    "netCDF4",
    # `ensemble_hofx.py` merges the split filter's per-member departures, and
    # netCDF4 cannot open an ioda observation file for append: it declines to
    # reopen ioda's HDF5 for writing and says only "Can't write file". h5py
    # opens the same file without complaint.
    "h5py",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
# The interactive console, and nothing else, needs these. Optional rather than a
# hard dependency because every compute job imports `ackbar`, and a terminal UI
# framework has no business being installed on a node that only runs a model.
# `src/ackbar/ui/` is the only package allowed to import them, and nothing
# outside it imports `ackbar.ui` at module scope.
ui = ["textual>=8"]

[project.scripts]
ackbar = "ackbar.cli:main"
ackbar-ui = "ackbar.ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
